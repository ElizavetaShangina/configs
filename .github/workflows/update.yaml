Учёл ваши замечания. Давайте разберёмся, почему прошлый вариант выдавал нерабочие конфигурации и как именно ломались ссылки.
Почему ломались ссылки?
В GitHub Actions конструкция cat << 'EOF' > скрипт.py экранирует текст, но внутри кода Python была строка:
python
filtered_configs = all_configs[:600] 
Используйте код с осторожностью.
Она брала первые 600 строк из общего массива. Из-за этого в пул попадали только конфигурации из первого файла (где лежит старый, мертвый мусор), а свежие рабочие конфиги из нижних ссылок (например, BLACK_VLESS_RUS.txt) просто обрезались и не доходили до теста. Кроме того, из-за отсутствия нормальной очистки строк в некоторых местах могли искажаться спецсимволы ссылок.
Почему GitHub из России доступен, но тест выдавал «мусор»?
Поскольку github.com в России открывается напрямую, Python-скрипт внутри облака GitHub Actions (где интернет полностью свободен) фиксировал успешный ответ 200 OK в любом случае, даже если сам VPN-туннель внутри xray-knife вообще не поднялся или упал с ошибкой. Скрипт думал, что сайт открылся через VPN, а на самом деле запрос шёл напрямую.
Как сделать тест на 100% достоверным?
Чтобы проверить, работает ли конфиг в условиях блокировок, мы должны тестировать его на домене, который железно заблокирован в РФ, но гарантированно открывается через рабочий VPN. Идеальный кандидат — rutracker.org или linkedin.com. Если прокси сможет скачать их защищенный заголовок, значит:
Туннель действительно поднялся и трафик идет через него.
Протокол конфигурации устойчив к ТСПУ (DPI) и обходит блокировки.
Ниже представлен полностью исправленный воркфлоу. Ссылки больше не режутся, а логика проверки изолирует трафик прокси от прямого интернета.
