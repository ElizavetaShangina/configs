name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests pysocks urllib3

      - name: Install Official Xray-Core Engine
        run: |
          URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.assets[] | select(.name == "Xray-linux-64.zip") | .browser_download_url')
          wget -qO xray.zip "$URL"
          unzip -o xray.zip -d xray_bin
          mv xray_bin/xray ./xray
          chmod +x xray

      - name: Fetch Russian-Tested & Global Reality Sources
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > fetch_candidates.py
          import base64
          import os
          import re
          import requests
          from urllib.parse import urlparse, parse_qs

          SOURCES = [
              # Специализированные базы для РФ (проверенные на обход ТСПУ)
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt",
              # Глобальные агрегаторы
              "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/top100.txt",
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/protocols/vless.txt",
              "https://raw.githubusercontent.com/vfarid/v2ray-share/master/splitted/reality.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"
          ]

          PROTO_REGEX = re.compile(r'((?:vless|trojan)://[^\s\'"<>]+)', re.IGNORECASE)

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if "vless://" in decoded or "trojan://" in decoded:
                      return decoded
              except Exception:
                  pass
              return text

          collected = []
          for url in SOURCES:
              try:
                  print(f"[*] Загрузка: {url}", flush=True)
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      text = decode_if_base64(resp.text)
                      matches = PROTO_REGEX.findall(text)
                      count = 0
                      for m in matches:
                          m = m.strip()
                          if m.startswith("vless://") and "security=reality" in m.lower():
                              collected.append(m)
                              count += 1
                          elif m.startswith("trojan://"):
                              collected.append(m)
                              count += 1
                      print(f"[+] Извлечено: {count} шт.", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          # Дедупликация по IP:PORT
          unique = []
          seen = set()
          for c in collected:
              try:
                  p = urlparse(c)
                  key = f"{p.hostname}:{p.port}"
                  if key not in seen and p.hostname and p.port:
                      seen.add(key)
                      unique.append(c)
              except Exception:
                  pass

          print(f"\n[*] Итого уникальных узлов для глубокого стресс-теста: {len(unique)}", flush=True)
          with open("raw_nodes.txt", "w", encoding="utf-8") as f:
              for c in unique[:600]:
                  f.write(c + "\n")
          EOF
          python3 fetch_candidates.py

      - name: True End-to-End Data Transfer Verification
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > deep_traffic_test.py
          import base64
          import concurrent.futures
          import json
          import os
          import socket
          import subprocess
          import sys
          import threading
          import time
          from urllib.parse import urlparse, parse_qs, unquote
          import requests
          import urllib3

          socket.setdefaulttimeout(4.0)
          urllib3.disable_warnings()

          TARGET_GOAL = 15
          CONCURRENCY = 12
          BLOCKED_COUNTRIES = {"RU", "BY", "IR", "CN", "CU", "KP"}

          # Узнаем собственный IP GitHub Actions, чтобы отсечь фейки
          RUNNER_IP = ""
          try:
              RUNNER_IP = requests.get("http://api.ipify.org", timeout=3.0).text.strip()
          except Exception:
              pass
          print(f"[*] IP раннера GitHub: {RUNNER_IP}")

          def build_xray_config(link, socks_port):
              try:
                  p = urlparse(link)
                  params = parse_qs(p.query)
                  host = p.hostname
                  port = int(p.port)
                  proto = p.scheme.lower()

                  inbound = {
                      "listen": "127.0.0.1",
                      "port": socks_port,
                      "protocol": "socks",
                      "settings": {"auth": "noauth", "udp": True}
                  }

                  if proto == "vless":
                      uuid = p.username
                      flow = params.get("flow", [""])[0]
                      pbk = params.get("pbk", [""])[0]
                      sid = params.get("sid", [""])[0]
                      sni = params.get("sni", [host])[0]
                      fp = params.get("fp", ["chrome"])[0]
                      net = params.get("type", ["tcp"])[0]

                      user_obj = {"id": uuid, "encryption": "none"}
                      if flow:
                          user_obj["flow"] = flow

                      reality_settings = {
                          "show": False,
                          "fingerprint": fp or "chrome",
                          "serverName": sni or host,
                          "publicKey": pbk
                      }
                      if sid:
                          reality_settings["shortId"] = sid

                      outbound = {
                          "protocol": "vless",
                          "settings": {
                              "vnext": [{"address": host, "port": port, "users": [user_obj]}]
                          },
                          "streamSettings": {
                              "network": net,
                              "security": "reality",
                              "realitySettings": reality_settings
                          }
                      }
                  elif proto == "trojan":
                      password = p.username
                      sni = params.get("sni", [host])[0]
                      net = params.get("type", ["tcp"])[0]
                      outbound = {
                          "protocol": "trojan",
                          "settings": {
                              "servers": [{"address": host, "port": port, "password": password}]
                          },
                          "streamSettings": {
                              "network": net,
                              "security": "tls",
                              "tlsSettings": {"serverName": sni or host}
                          }
                      }
                  else:
                      return None

                  return {
                      "log": {"loglevel": "none"},
                      "inbounds": [inbound],
                      "outbounds": [outbound]
                  }
              except Exception:
                  return None

          def wait_for_port(port, timeout=1.5):
              t0 = time.time()
              while time.time() - t0 < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=0.1):
                          return True
                  except Exception:
                      time.sleep(0.04)
              return False

          def test_real_traffic(item):
              idx, link, worker_id = item
              if stop_event.is_set():
                  return

              port = 31000 + worker_id
              cfg = build_xray_config(link, port)
              if not cfg:
                  return

              cfg_file = f"xray_cfg_{worker_id}.json"
              with open(cfg_file, "w") as f:
                  json.dump(cfg, f)

              proc = None
              try:
                  proc = subprocess.Popen(["./xray", "run", "-c", cfg_file], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if not wait_for_port(port, timeout=1.2):
                      return

                  proxies = {
                      "http": f"socks5h://127.0.0.1:{port}",
                      "https": f"socks5h://127.0.0.1:{port}"
                  }

                  # 1. ТЕСТ НА РЕАЛЬНУЮ ПЕРЕДАЧУ ДАННЫХ (Cloudflare Trace)
                  # Если ключ мертв или трафик заблокирован, соединение упадет с ошибкой
                  trace_resp = requests.get("https://cloudflare.com/cdn-cgi/trace", proxies=proxies, timeout=3.5)
                  if trace_resp.status_code != 200 or "ip=" not in trace_resp.text:
                      return

                  # Парсим реальный исходящий IP
                  exit_ip = ""
                  for line in trace_resp.text.splitlines():
                      if line.startswith("ip="):
                          exit_ip = line.split("=")[1].strip()
                          break

                  if not exit_ip or exit_ip == RUNNER_IP:
                      return  # Это фиктивный fallback

                  # 2. ПРОВЕРКА СТРАНЫ ВЫХОДА
                  country = "UNKNOWN"
                  try:
                      geo_res = requests.get(f"https://ipapi.co/{exit_ip}/country/", proxies=proxies, timeout=2.5)
                      if geo_res.status_code == 200:
                          country = geo_res.text.strip().upper()
                  except Exception:
                      pass

                  if country in BLOCKED_COUNTRIES:
                      return

                  # 3. ТЕСТ GOOGLE AI STUDIO (Проверка отсутствия геоблока)
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                  }
                  t0 = time.time()
                  ai_res = requests.get("https://aistudio.google.com/prompts/new_chat", proxies=proxies, headers=headers, timeout=4.5, allow_redirects=True)
                  latency = int((time.time() - t0) * 1000)

                  final_url = ai_res.url.lower()
                  body = ai_res.text.lower()

                  if ai_res.status_code in [200, 302]:
                      if "available_regions" not in final_url and "available-regions" not in final_url and "not available in your country" not in body:
                          with lock:
                              if len(working_nodes) < TARGET_GOAL:
                                  working_nodes.append(link)
                                  p = urlparse(link)
                                  print(f"[🔥] [{len(working_nodes):02d}/{TARGET_GOAL:02d}] 100% РАБОЧИЙ ТУННЕЛЬ! Страна: {country} | IP: {exit_ip} | AI Studio: {latency}ms | Узел: {p.hostname}:{p.port}", flush=True)
                                  if len(working_nodes) >= TARGET_GOAL:
                                      print(f"\n[🎯] Набрано {TARGET_GOAL} проверенных рабочих узлов! Завершаем...", flush=True)
                                      stop_event.set()
              except Exception:
                  pass
              finally:
                  if proc:
                      try:
                          proc.kill()
                          proc.wait(timeout=0.2)
                      except Exception:
                          pass
                  if os.path.exists(cfg_file):
                      try:
                          os.remove(cfg_file)
                      except Exception:
                          pass

          working_nodes = []
          lock = threading.Lock()
          stop_event = threading.Event()

          with open("raw_nodes.txt", "r", encoding="utf-8") as f:
              nodes = [line.strip() for line in f if line.strip()]

          print("=" * 80)
          print(f"[*] Старт сквозного стресс-теста передачи данных для {len(nodes)} кандидатов...")
          print("=" * 80, flush=True)

          tasks = [(i, node, i % CONCURRENCY) for i, node in enumerate(nodes)]

          with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
              futures = [executor.submit(test_real_traffic, t) for t in tasks]
              for f in concurrent.futures.as_completed(futures):
                  if stop_event.is_set():
                      break

          print("\n" + "=" * 80)
          print(f"[ИТОГ] Сквозной тест завершен! Найдено гарантированно рабочих узлов: {len(working_nodes)}/{TARGET_GOAL}")
          print("=" * 80, flush=True)

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in working_nodes:
                  f.write(c + "\n")

          if working_nodes:
              b64_sub = base64.b64encode(("\n".join(working_nodes) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_sub)
              print("[+] sub.txt и clean_configs.txt успешно обновлены.")
          else:
              open("sub.txt", "w").close()
              print("[!] Ни один сервер не прошел сквозной тест передачи данных.")
          EOF
          python3 -u deep_traffic_test.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Update 100% verified working configs [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
            git push
          fi
