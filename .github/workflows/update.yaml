on:
  schedule:
    - cron: '0 */1 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://github.com" 

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Configs from Sources
        run: |
          touch public_raw.txt
          wget -qO- "https://githubusercontent.com" >> public_raw.txt
          wget -qO- "https://github.com" >> public_raw.txt
          wget -qO- "https://github.com" >> public_raw.txt
          wget -qO- "https://github.com" >> public_raw.txt
          wget -qO- "https://githubusercontent.com" >> public_raw.txt
          wget -qO- "https://githubusercontent.com" >> public_raw.txt
          wget -qO- "https://githubusercontent.com" >> public_raw.txt
          wget -qO- "https://githubusercontent.com" >> public_raw.txt

      - name: Setup Xray-Knife
        run: |
          # ИСПРАВЛЕНО: Возвращен правильный адрес GitHub API
          URL=$(curl -s https://github.com | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Ultra Fast Double-Pass Validation
        run: |
          # Шаг 1: Лавинный экспресс-тест (Таймаут 1.2 сек, 400 потоков). Пролетает 17000 конфигов примерно за 45-60 секунд.
          print("[-] Запуск лавинного отсева 17k конфигов...")
          ./xray-knife http --file public_raw.txt --url https://github.com --mdelay 1200 --thread 400 --out fast_passed.txt || touch fast_passed.txt

          if [ ! -s fast_passed.txt ]; then
            echo "[!] Нет живых конфигураций после первичного теста."
            touch best.txt
          else
            # Оставляем только ТОП-100 лучших конфигов для глубокого анализа, чтобы сэкономить время
            head -n 100 fast_passed.txt > top_candidates.txt
            
            # Шаг 2: Глубокий честный тест ТОП-100 (Таймаут 2.5 сек, 30 потоков) на реальную отдачу контента
            echo "[-] Запуск глубокой валидации лучших кандидатов..."
            ./xray-knife http --file top_candidates.txt --url https://github.com --mdelay 2500 --thread 30 --out best.txt || touch best.txt
          fi

      - name: Post-Process and Base64 Encode
        run: |
          cat << 'EOF' > Сleanup.py
          import os
          # Дополнительная проверка на случай, если xray-knife пропустил пустые строки
          if os.path.exists("best.txt") and os.path.getsize("best.txt") > 0:
              with open("best.txt", "r") as f:
                  lines = [line.strip() for line in f if line.strip()]
              # Берем финальные 25 самых качественных конфигураций
              final_pool = lines[:25]
              with open("final_valid.txt", "w") as f:
                  f.write("\n".join(final_pool) + "\n")
              print(f"[+] Успешно отобрано {len(final_pool)} лучших конфигураций.")
          EOF
          python3 Сleanup.py

          if [ -f final_valid.txt ] && [ -s final_valid.txt ]; then
            cat final_valid.txt | base64 -w 0 > sub.txt
          else
            echo "Working configs not found"
            touch sub.txt
          fi
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s sub.txt ]; then
            git add sub.txt
            git commit -m "Update: $(date +'%Y-%m-%d %H:%M') [Ultra Fast Mode]" || echo "No changes"
            git push
          fi
