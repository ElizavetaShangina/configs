          with open("public_raw.txt", "r") as f:
              all_configs = list(set([line.strip() for line in f if line.strip()])) # Убираем дубликаты сразу

          print(f"[-] Загружено уникальных конфигов: {len(all_configs)}")

          # Фильтруем откровенный спам: берем максимум 200 конфигов из каждого источника/типа
          # Чтобы не гонять 17000 одинаковых строк
          filtered_configs = all_configs[:600] 

          real_working = []
          socks_port = 19999

          print(f"[-] Начинаем глубокий тест {len(filtered_configs)} конфигураций через поднятие туннелей...")

          for idx, config in enumerate(filtered_configs):
