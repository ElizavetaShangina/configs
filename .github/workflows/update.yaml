name: Auto Update Sub

on:
  schedule:
    - cron: '0 */1 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://github.com" 

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests PySocks

      - name: Download Configs from Sources
        run: |
          touch public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt" >> public_raw.txt
          wget -qO- "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/1.txt" >> public_raw.txt
          wget -qO- "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/6.txt" >> public_raw.txt
          wget -qO- "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/25.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" >> public_raw.txt

      - name: Setup Xray-Knife
        run: |
          # ИСПРАВЛЕНО: Возвращен правильный адрес GitHub API
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Real Proxy Validation (Strict Anti-DPI)
        run: |
          cat << 'EOF' > deep_validate.py
          import subprocess
          import time
          import requests
          import os

          # Читаем все сырые конфигурации
          with open("public_raw.txt", "r") as f:
              all_configs = list(set([line.strip() for line in f if line.strip()])) # Убираем дубликаты сразу

          print(f"[-] Загружено уникальных конфигов: {len(all_configs)}")

          # Фильтруем откровенный спам: берем максимум 200 конфигов из каждого источника/типа
          # Чтобы не гонять 17000 одинаковых строк
          filtered_configs = all_configs[:600] 

          real_working = []
          socks_port = 19999

          print(f"[-] Начинаем глубокий тест {len(filtered_configs)} конфигураций через поднятие туннелей...")

          for idx, config in enumerate(filtered_configs):
              # Запускаем локальный прокси-сервер для конкретного конфига
              # Используем xray-knife proxy, привязав его к уникальному порту
              proc = subprocess.Popen(
                  [f"./xray-knife", "proxy", "-c", config, "--port", str(socks_port)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )
              
              # Даем 1 секунду ядру Xray инициализировать туннель
              time.sleep(1.0)

              proxies = {
                  'http': f'socks5h://127.0.0.1:{socks_port}',
                  'https': f'socks5h://127.0.0.1:{socks_port}'
              }

              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
              }

              is_valid = False
              try:
                  # Делаем РЕАЛЬНЫЙ запрос к GitHub с жестким таймаутом в 3.5 секунды
                  response = requests.get("https://aistudio.google.com/prompts/new_chat", proxies=proxies, headers=headers, timeout=3.5)
                  
                  # Критически важная проверка контента, чтобы исключить ложные срабатывания ТСПУ
                  if response.status_code == 200 and "github" in response.text.lower():
                      is_valid = True
                      print(f"[+] Конфиг {idx+1} РАБОТАЕТ! Настоящий доступ к GitHub подтвержден.")
              except Exception as e:
                  # Сбой подключения, таймаут или блокировка протокола на этапе TLS Handshake
                  pass

              # Обязательно убиваем процесс прокси, чтобы освободить порт
              proc.terminate()
              proc.wait()

              if is_valid:
                  real_working.append(config)
                  # Нам нужно 15-20 гарантированно рабочих штук
                  if len(real_working) >= 20:
                      print("[!] Пул лучших конфигураций успешно собран.")
                      break

          # Записываем честный результат
          with open("best.txt", "w") as f:
              for conf in real_working:
                  f.write(conf + "\n")
          EOF
          python3 deep_validate.py

      - name: Base64 Encode Output
        run: |
          if [ -f best.txt ] && [ -s best.txt ]; then
            cat best.txt | base64 -w 0 > sub.txt
            echo "[+] Файл sub.txt успешно сгенерирован."
          else
            echo "[!] Рабочие конфигурации не найдены. Создается пустой файл."
            touch sub.txt
          fi
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s sub.txt ]; then
            git add sub.txt
            git commit -m "Update: $(date +'%Y-%m-%d %H:%M') [Strict Checked]" || echo "No changes"
            git push
          fi
