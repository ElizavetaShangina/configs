name: Auto Update Sub

on:
  schedule:
    - cron: '0 */1 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://github.com" 

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Download Configs from Sources
        run: |
          touch public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt" >> public_raw.txt
          wget -qO- "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/1.txt" >> public_raw.txt
          wget -qO- "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/6.txt" >> public_raw.txt
          wget -qO- "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/25.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" >> public_raw.txt


      - name: Setup Xray-Knife
        run: |
          URL=$(curl -s https://github.com | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Fast Parallel Validation (Python + Go Multi-threading)
        run: |
          cat << 'EOF' > validate.py
          import subprocess
          import os
          from concurrent.futures import ThreadPoolExecutor, as_completed

          # 1. Быстрый многопоточный отсев средствами самого Go-компилятора xray-knife
          # Увеличиваем потоки до 300, снижаем таймаут до 1200мс для резкого ускорения
          print("[-] Запуск сверхбыстрого предварительного теста через xray-knife (300 потоков)...")
          cmd = "./xray-knife http --file public_raw.txt --url https://github.com --mdelay 1200 --thread 300 --out pre_valid.txt"
          subprocess.run(cmd, shell=True)

          if not os.path.exists("pre_valid.txt") or os.path.getsize("pre_valid.txt") == 0:
              print("[!] Нет живых конфигураций после первичного теста.")
              with open("sub.txt", "w") as f: f.write("")
              exit(0)

          # Читаем условно рабочие конфиги
          with open("pre_valid.txt", "r") as f:
              configs = [line.strip() for line in f if line.strip()]

          print(f"[+] Первичный тест прошли {len(configs)} конфигураций.")
          
          # Ограничиваем пул для глубокого теста первыми 150-ми самыми быстрыми (они уже отсортированы по пингу)
          configs_to_test = configs[:150]
          real_working = []

          # Функция изолированного быстрого теста одного конфига
          def check_single_config(config):
              test_cmd = f'./xray-knife http --config "{config}" --url "https://github.com" --thread 1 --mdelay 1000'
              result = subprocess.run(test_cmd, shell=True, capture_output=True, text=True)
              output = result.stdout.lower()
              if "200 ok" in output or ("github" in output and "fail" not in output):
                  return config
              return None

          # 2. Глубокий параллельный тест в Python (в 20 потоков) только для ТОП-150 кандидатов
          print(f"[-] Начинаем глубокую параллельную валидацию ТОП-{len(configs_to_test)} кандидатов...")
          with ThreadPoolExecutor(max_workers=20) as executor:
              futures = {executor.submit(check_single_config, conf): conf for conf in configs_to_test}
              for future in as_completed(futures):
                  res = future.result()
                  if res:
                      real_working.append(res)
                      # Как только набрали 25 идеальных конфигов — останавливаемся ради экономии времени
                      if len(real_working) >= 25:
                          break

          print(f"[+] Итоговый результат: найдено {len(real_working)} гарантированно рабочих конфигов.")
          
          # Записываем результат
          with open("best.txt", "w") as f:
              for conf in real_working:
                  f.write(conf + "\n")
          EOF
          python3 validate.py

      - name: Base64 Encode Output
        run: |
          if [ -f best.txt ] && [ -s best.txt ]; then
            cat best.txt | base64 -w 0 > sub.txt
          else
            echo "No working configs found"
            touch sub.txt
          fi
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s sub.txt ]; then
            git add sub.txt
            git commit -m "Update: $(date +'%Y-%m-%d %H:%M') [Optimized Speed]" || echo "No changes"
            git push
          fi
