name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Install Xray-Knife (Native Go Engine)
        run: |
          echo "[*] Загрузка Xray-knife..."
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife
          ./xray-knife version || true

      - name: Fetch 16 Mega-Sources & Extract Candidates
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > fetch_all.py
          import base64
          import random
          import re
          import requests
          from urllib.parse import urlparse

          # 16 крупнейших агрегаторов, обновляющихся каждые 5-30 минут
          SOURCES = [
              # Верифицированные потоки с реальным трафиком
              "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/top100.txt",
              "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/verified/configs_base64.txt",
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/v2ray-base64.txt",
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/protocols/vless.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/all_configs.txt",
              "https://raw.githubusercontent.com/MahanKenway/Freedom-V2Ray/main/all.txt",
              # SoliSpirit & Barry-Far
              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/all_configs.txt",
              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/vless.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/vless.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub6.txt",
              # Epodonios, Yebekhe, Mahdibland, MatinGhanbari
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/raw/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/yebekhe/TelegramV2rayCollector/main/sub/normal/reality",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/splitted/reality.txt",
              "https://raw.githubusercontent.com/MustafaBaqer/VestraNet-Nodes/main/protocols/vless.txt",
              "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/v2ray/all_sub.txt"
          ]

          PROTO_REGEX = re.compile(r'((?:vless|vmess|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if any(p in decoded for p in ["vless://", "vmess://", "trojan://", "ss://"]):
                      return decoded
              except Exception:
                  pass
              return text

          collected = set()
          print("=" * 75, flush=True)
          print("[*] СКАЧИВАНИЕ ИЗ 16 ГЛОБАЛЬНЫХ ИСТОЧНИКОВ", flush=True)
          print("=" * 75, flush=True)

          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      text = decode_if_base64(resp.text)
                      matches = PROTO_REGEX.findall(text)
                      count = 0
                      for m in matches:
                          m = m.strip()
                          clean_base = m.split("#")[0].strip()
                          if clean_base not in collected:
                              collected.add(m)
                              count += 1
                      source_name = "/".join(url.split("/")[-3:])
                      print(f"[+] {source_name}: извлечено {count} шт.", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          unique_list = list(collected)
          print(f"\n[*] Всего уникальных узлов для проверки: {len(unique_list)}", flush=True)

          # Перемешиваем кандидатов
          random.shuffle(unique_list)

          # Берем большой срез до 1000 кандидатов на тест
          with open("candidates.txt", "w", encoding="utf-8") as f:
              for c in unique_list[:1000]:
                  f.write(c + "\n")
          EOF
          python3 fetch_all.py

      - name: Test ALL Candidates (NO LIMITS)
        run: |
          if [ -s candidates.txt ]; then
            echo "================================================================================"
            echo "[*] Запуск нативного тестирования всего пула без ограничений на количество..."
            echo "================================================================================"
            
            # Проверяем все узлы без флага --max-passed (сохраняем ВСЁ что работает)
            ./xray-knife http -f candidates.txt \
              -t 35 \
              --timeout 3000 \
              --test-urls "https://www.google.com/generate_204" \
              -o passed_raw.txt || true
          fi

      - name: Format ALL Working Subscriptions
        run: |
          cat << 'EOF' > make_sub.py
          import base64
          import os
          import re
          import datetime

          PROTO_REGEX = re.compile(r'((?:vless|vmess|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          cleaned = []
          seen_hosts = set()

          if os.path.exists("passed_raw.txt"):
              with open("passed_raw.txt", "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      matches = PROTO_REGEX.findall(line)
                      for m in matches:
                          m = m.strip()
                          clean_base = m.split("#")[0].strip()
                          if clean_base not in seen_hosts:
                              seen_hosts.add(clean_base)
                              cleaned.append(m)

          now_str = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          print("\n" + "=" * 75)
          print(f"[ИТОГ] Найдено и сохранено РАБОЧИХ серверов (БЕЗ ОГРАНИЧЕНИЙ): {len(cleaned)}")
          print(f"[ИТОГ] Время обновления: {now_str}")
          print("=" * 75)

          # Записываем все рабочие узлы
          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in cleaned:
                  f.write(c + "\n")

          # Сохраняем Base64 подписку
          if cleaned:
              b64_sub = base64.b64encode(("\n".join(cleaned) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_sub)
              print("[+] sub.txt и clean_configs.txt успешно сгенерированы.")
          else:
              open("sub.txt", "w").close()
              print("[!] Внимание: Рабочие узлы не обнаружены.")
          EOF
          python3 make_sub.py

      - name: Commit and Push (Guaranteed Sync)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase || true
          git add sub.txt clean_configs.txt
          git commit -m "Auto-Update: $(date -u +'%Y-%m-%d %H:%M:%S UTC') [All Live Nodes]" || echo "No changes to commit"
          git push

      - name: Purge jsDelivr CDN Cache
        run: |
          echo "[*] Сброс кэша CDN jsDelivr..."
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/sub.txt" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/clean_configs.txt" || true
          echo "[+] Запрос на сброс кэша отправлен."
