name: Auto Update Sub

on:
  schedule:
    - cron: '0 */1 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://aistudio.google.com/prompts/new_chat"
  URL_5: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Sub6.txt"
  URL_6: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt"
  URL_7: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"
  URL_8: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Install Xray-Knife
        run: |
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Prepare and Decode Configs
        run: |
          cat << 'EOF' > prepare.py
          import base64
          import os
          import re
          import requests

          SOURCES = [
              os.environ.get("URL_5"),
              os.environ.get("URL_6"),
              os.environ.get("URL_7"),
              os.environ.get("URL_8")
          ]

          PROTO_REGEX = re.compile(r'^(vless|vmess|trojan|ss|ssr|hysteria|hysteria2|hy2|wireguard|tuic)://', re.IGNORECASE)

          def extract_configs_from_text(raw_text):
              extracted = []
              # Пробуем декодировать Base64, если весь ответ закодирован
              try:
                  decoded = base64.b64decode(raw_text.strip()).decode('utf-8', errors='ignore')
                  for line in decoded.splitlines():
                      line = line.strip()
                      if PROTO_REGEX.match(line):
                          extracted.append(line)
              except Exception:
                  pass

              # Читаем как обычный текст
              for line in raw_text.splitlines():
                  line = line.strip()
                  if PROTO_REGEX.match(line):
                      extracted.append(line)
              return extracted

          all_configs = []
          for url in SOURCES:
              if not url:
                  continue
              try:
                  print(f"[*] Загрузка источника: {url}", flush=True)
                  resp = requests.get(url, timeout=15)
                  if resp.status_code == 200:
                      confs = extract_configs_from_text(resp.text)
                      all_configs.extend(confs)
                      print(f"[+] Получено строк: {len(confs)}", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          # Дедупликация
          unique_configs = []
          seen = set()
          for c in all_configs:
              if c not in seen:
                  seen.add(c)
                  unique_configs.append(c)

          print(f"[*] Всего уникальных конфигов для проверки: {len(unique_configs)}", flush=True)

          with open("all_configs.txt", "w", encoding="utf-8") as f:
              for c in unique_configs:
                  f.write(c + "\n")
          EOF
          python3 prepare.py

      - name: Run High-Speed AI Studio Validation
        run: |
          if [ -s all_configs.txt ]; then
            echo "[*] Запуск нативного тестирования xray-knife против Google AI Studio..."
            
            # xray-knife http тестирует напрямую ядрами с лимитом на 20 успешно прошедших
            ./xray-knife http -f all_configs.txt \
              -t 40 \
              --test-urls "${{ env.TARGET_SITE }}" \
              --max-passed 20 \
              -o best_raw.txt || true
              
            # Если xray-knife сохранил результат
            if [ -f best_raw.txt ] && [ -s best_raw.txt ]; then
              head -n 20 best_raw.txt > best.txt
              echo "[+] Успешно отобрано $(wc -l < best.txt) рабочих конфигураций."
            else
              echo "[!] best_raw.txt пуст."
              touch best.txt
            fi
          else
            echo "[!] Файл all_configs.txt пуст."
            touch best.txt
          fi

      - name: Base64 Encode Output
        run: |
          if [ -s best.txt ]; then
            cat best.txt | base64 -w 0 > sub.txt
            echo "[+] sub.txt обновлен."
          else
            echo "[!] Рабочих прокси не обнаружено."
            > sub.txt
          fi
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s sub.txt ]; then
            git add sub.txt
            git commit -m "Update working AI Studio proxies: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
            git push
          fi
