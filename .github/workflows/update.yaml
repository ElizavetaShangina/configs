name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests pysocks urllib3

      - name: Install Official Xray-Core
        run: |
          URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.assets[] | select(.name == "Xray-linux-64.zip") | .browser_download_url')
          wget -qO xray.zip "$URL"
          unzip -o xray.zip -d xray_bin
          mv xray_bin/xray ./xray
          chmod +x xray

      - name: Fetch and Filter Compatible Reality Nodes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > prepare_nodes.py
          import base64
          import os
          import re
          import requests
          from urllib.parse import urlparse, parse_qs

          SOURCES = [
              # Специализированные российские репозитории
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt",
              "https://raw.githubusercontent.com/VOID-Anonymity/V.O.I.D-VPN_Bypass/refs/heads/main/url_work.txt",
              "https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/main/githubmirror/clean/vless.txt",
              "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/All_Configs_Sub.txt"
          ]

          # Заблокированные страны для Google AI Studio и хосты
          BLOCKED_HOST_SUFFIXES = (".ir", ".cn", ".ru", ".by", ".cu", ".kp")
          URI_REGEX = re.compile(r'(vless://[^\s\'"<>]+)', re.IGNORECASE)

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if "vless://" in decoded:
                      return decoded
              except Exception:
                  pass
              return text

          def is_v2ray_compatible_reality(link):
              if not link.startswith("vless://"):
                  return False
              
              link_lower = link.lower()
              if "security=reality" not in link_lower:
                  return False

              # Отсекаем неподдерживаемый xhttp/splithttp
              if "type=xhttp" in link_lower or "type=splithttp" in link_lower:
                  return False

              try:
                  p = urlparse(link)
                  host = p.hostname.lower() if p.hostname else ""
                  
                  # Отсекаем Иран, Китай, РФ
                  if any(host.endswith(sfx) for sfx in BLOCKED_HOST_SUFFIXES):
                      return False

                  params = parse_qs(p.query)
                  pbk = params.get("pbk", [""])[0]
                  if not pbk:
                      return False

                  return True
              except Exception:
                  return False

          collected = []
          for url in SOURCES:
              try:
                  print(f"[*] Загрузка: {url}", flush=True)
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      text = decode_if_base64(resp.text)
                      matches = URI_REGEX.findall(text)
                      count = 0
                      for m in matches:
                          m = m.strip()
                          if is_v2ray_compatible_reality(m):
                              collected.append(m)
                              count += 1
                      print(f"[+] Подходящих TCP/Reality узлов: {count}", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          # Дедупликация
          unique = []
          seen = set()
          for c in collected:
              try:
                  p = urlparse(c)
                  key = f"{p.hostname}:{p.port}"
                  if key not in seen and p.hostname and p.port:
                      seen.add(key)
                      unique.append(c)
              except Exception:
                  pass

          print(f"\n[+] Итого уникальных совместимых кандидатов: {len(unique)}", flush=True)
          with open("nodes_to_test.txt", "w", encoding="utf-8") as f:
              for c in unique[:400]:
                  f.write(c + "\n")
          EOF
          python3 prepare_nodes.py

      - name: Double-Check Validation (Telegram + Google AI Studio)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > test_tg_and_ai.py
          import base64
          import concurrent.futures
          import json
          import os
          import socket
          import subprocess
          import sys
          import threading
          import time
          from urllib.parse import urlparse, parse_qs
          import requests
          import urllib3

          socket.setdefaulttimeout(4.0)
          urllib3.disable_warnings()

          TARGET_GOAL = 15
          CONCURRENCY = 10
          BLOCKED_COUNTRIES = {"RU", "BY", "IR", "CN", "CU", "KP"}

          def build_xray_config(link, socks_port):
              try:
                  p = urlparse(link)
                  params = parse_qs(p.query)
                  host = p.hostname
                  port = int(p.port)
                  uuid = p.username

                  flow = params.get("flow", [""])[0]
                  pbk = params.get("pbk", [""])[0]
                  sid = params.get("sid", [""])[0]
                  sni = params.get("sni", [host])[0]
                  fp = params.get("fp", ["chrome"])[0]
                  net = params.get("type", ["tcp"])[0]

                  user_obj = {"id": uuid, "encryption": "none"}
                  if flow:
                      user_obj["flow"] = flow

                  reality_settings = {
                      "show": False,
                      "fingerprint": fp or "chrome",
                      "serverName": sni or host,
                      "publicKey": pbk
                  }
                  if sid:
                      reality_settings["shortId"] = sid

                  stream_settings = {
                      "network": net,
                      "security": "reality",
                      "realitySettings": reality_settings
                  }

                  if net == "grpc":
                      service_name = params.get("serviceName", [""])[0]
                      if service_name:
                          stream_settings["grpcSettings"] = {"serviceName": service_name}

                  return {
                      "log": {"loglevel": "none"},
                      "inbounds": [{
                          "listen": "127.0.0.1",
                          "port": socks_port,
                          "protocol": "socks",
                          "settings": {"auth": "noauth", "udp": True}
                      }],
                      "outbounds": [{
                          "protocol": "vless",
                          "settings": {
                              "vnext": [{"address": host, "port": port, "users": [user_obj]}]
                          },
                          "streamSettings": stream_settings
                      }]
                  }
              except Exception:
                  return None

          def wait_for_port(port, timeout=1.2):
              t0 = time.time()
              while time.time() - t0 < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=0.1):
                          return True
                  except Exception:
                      time.sleep(0.04)
              return False

          def test_node(item):
              idx, link, worker_id = item
              if stop_event.is_set():
                  return

              port = 32000 + worker_id
              cfg = build_xray_config(link, port)
              if not cfg:
                  return

              cfg_file = f"xray_{worker_id}.json"
              with open(cfg_file, "w") as f:
                  json.dump(cfg, f)

              proc = None
              try:
                  proc = subprocess.Popen(["./xray", "run", "-c", cfg_file], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if not wait_for_port(port, timeout=1.0):
                      return

                  proxies = {
                      "http": f"socks5h://127.0.0.1:{port}",
                      "https": f"socks5h://127.0.0.1:{port}"
                  }
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                  }

                  # 1. ТЕСТ TELEGRAM API (Проверка прохождения реального полезного трафика)
                  tg_res = requests.get("https://api.telegram.org", proxies=proxies, timeout=3.5)
                  if tg_res.status_code not in [200, 404, 302]:
                      return

                  # 2. ТЕСТ СТРАНЫ ВЫХОДА (GeoIP)
                  country = "UNKNOWN"
                  try:
                      geo_res = requests.get("https://api.country.is", proxies=proxies, timeout=2.5)
                      if geo_res.status_code == 200:
                          country = geo_res.json().get("country", "UNKNOWN").upper()
                  except Exception:
                      pass

                  if country in BLOCKED_COUNTRIES:
                      return

                  # 3. ТЕСТ GOOGLE AI STUDIO (Проверка отсутствия геоблока)
                  t0 = time.time()
                  ai_res = requests.get("https://aistudio.google.com/prompts/new_chat", proxies=proxies, headers=headers, timeout=4.5, allow_redirects=True)
                  latency = int((time.time() - t0) * 1000)

                  final_url = ai_res.url.lower()
                  body = ai_res.text.lower()

                  if ai_res.status_code in [200, 302]:
                      if "available_regions" not in final_url and "available-regions" not in final_url and "not available in your country" not in body:
                          with lock:
                              if len(confirmed_nodes) < TARGET_GOAL:
                                  confirmed_nodes.append(link)
                                  p = urlparse(link)
                                  print(f"[🌟] [{len(confirmed_nodes):02d}/{TARGET_GOAL:02d}] РАБОТАЕТ И TG, И AI STUDIO! | Страна: {country} | Пинг: {latency}ms | Хост: {p.hostname}:{p.port}", flush=True)
                                  if len(confirmed_nodes) >= TARGET_GOAL:
                                      print(f"\n[🎯] Набрано {TARGET_GOAL} подтвержденных конфигураций! Завершаем...", flush=True)
                                      stop_event.set()
              except Exception:
                  pass
              finally:
                  if proc:
                      try:
                          proc.kill()
                          proc.wait(timeout=0.2)
                      except Exception:
                          pass
                  if os.path.exists(cfg_file):
                      try:
                          os.remove(cfg_file)
                      except Exception:
                          pass

          confirmed_nodes = []
          lock = threading.Lock()
          stop_event = threading.Event()

          with open("nodes_to_test.txt", "r", encoding="utf-8") as f:
              nodes = [line.strip() for line in f if line.strip()]

          print("=" * 80)
          print(f"[*] Запуск сквозного тестирования TG + AI Studio ({len(nodes)} кандидатов)...")
          print("=" * 80, flush=True)

          tasks = [(i, node, i % CONCURRENCY) for i, node in enumerate(nodes)]

          with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
              futures = [executor.submit(test_node, t) for t in tasks]
              for f in concurrent.futures.as_completed(futures):
                  if stop_event.is_set():
                      break

          print("\n" + "=" * 80)
          print(f"[ИТОГ] Отобрано рабочих конфигураций: {len(confirmed_nodes)}/{TARGET_GOAL}")
          print("=" * 80, flush=True)

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in confirmed_nodes:
                  f.write(c + "\n")

          if confirmed_nodes:
              b64_sub = base64.b64encode(("\n".join(confirmed_nodes) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_sub)
              print("[+] sub.txt и clean_configs.txt успешно записаны.")
          else:
              open("sub.txt", "w").close()
              print("[!] Не удалось найти рабочие узлы.")
          EOF
          python3 -u test_tg_and_ai.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Update working TG + AI Studio configs [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
            git push
          fi
