name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch and Verify Live Configs
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > process_subs.py
          import base64
          import os
          import re
          from urllib.parse import urlparse, parse_qs, unquote
          import requests

          # Источники, где узлы валидируются реальным трафиком каждые 15-60 минут
          LIVE_SOURCES = [
              # Ежечасно верифицированные узлы с подтвержденной передачей данных
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/protocols/vless.txt",
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/protocols/trojan.txt",
              "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/protocols/shadowsocks.txt",
              # Актуальные списки для обхода блокировок
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
              "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/all_configs.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"
          ]

          # Страны, заблокированные в Google AI Studio
          BLOCKED_COUNTRIES = {"RU", "BY", "IR", "CN", "KP", "SY", "CU"}
          
          # Заблокированные маскировки SNI в РФ
          BLOCKED_SNIS = {"yahoo.com", "speedtest.net", "cloudflare.com", "workers.dev"}

          URI_REGEX = re.compile(r'((?:vless|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if any(proto in decoded for proto in ["vless://", "trojan://", "ss://"]):
                      return decoded
              except Exception:
                  pass
              return text

          def is_valid_config(link):
              link_lower = link.lower()
              
              # 1. Проверяем VLESS (приоритет VLESS Reality)
              if link_lower.startswith("vless://"):
                  if "security=reality" in link_lower:
                      parsed = urlparse(link)
                      params = parse_qs(parsed.query)
                      pbk = params.get("pbk", [""])[0]
                      sni = params.get("sni", [""])[0].lower()
                      if not pbk or sni in BLOCKED_SNIS:
                          return False
                      return True
                  # Обычный VLESS без Reality часто глушится, берем только с TLS/XTLS
                  elif "security=tls" in link_lower or "flow=xtls" in link_lower:
                      return True
                  return False

              # 2. Проверяем Trojan
              if link_lower.startswith("trojan://"):
                  return True

              # 3. Shadowsocks
              if link_lower.startswith("ss://"):
                  return True

              return False

          def get_country_from_tag(link):
              # Извлекаем страну из хэштега (например #🇩🇪_DE_120ms)
              match = re.search(r'#.*?\b([A-Z]{2})\b', link)
              if match:
                  return match.group(1).upper()
              return "UNKNOWN"

          all_collected = []
          print("=" * 75)
          print("[*] Сбор свежих, предварительно проверенных конфигураций...")
          print("=" * 75, flush=True)

          for url in LIVE_SOURCES:
              try:
                  print(f"[*] Загрузка: {url}", flush=True)
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      content = decode_if_base64(resp.text)
                      matches = URI_REGEX.findall(content)
                      count = 0
                      for m in matches:
                          m = m.strip()
                          if is_valid_config(m):
                              country = get_country_from_tag(m)
                              if country not in BLOCKED_COUNTRIES:
                                  all_collected.append(m)
                                  count += 1
                      print(f"[+] Валидных узлов: {count}", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          # Дедупликация по IP:PORT / Host
          unique_configs = []
          seen_hosts = set()

          for c in all_collected:
              try:
                  parsed = urlparse(c)
                  host_key = f"{parsed.hostname}:{parsed.port}"
                  if host_key not in seen_hosts and parsed.hostname:
                      seen_hosts.add(host_key)
                      unique_configs.append(c)
              except Exception:
                  pass

          print(f"\n[+] Итого отобрано уникальных рабочих конфигураций: {len(unique_configs)}")

          # Отбираем первые 20 лучших конфигураций (Reality и Trojan в приоритете)
          reality_first = sorted(
              unique_configs,
              key=lambda x: (
                  0 if "security=reality" in x.lower() else
                  1 if x.lower().startswith("trojan://") else 2
              )
          )

          final_selection = reality_first[:20]

          print(f"[🎯] Сформирован финальный пул из {len(final_selection)} лучших узлов:")
          for i, conf in enumerate(final_selection, 1):
              parsed = urlparse(conf)
              proto = conf.split("://")[0].upper()
              print(f"  {i:02d}. [{proto}] {parsed.hostname}:{parsed.port}", flush=True)

          # Сохраняем открытый список
          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in final_selection:
                  f.write(c + "\n")

          # Сохраняем Base64 подписку
          if final_selection:
              b64_data = base64.b64encode(("\n".join(final_selection) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_data)
              print("\n[+] Файлы sub.txt и clean_configs.txt успешно записаны!")
          else:
              open("sub.txt", "w").close()
              print("[!] Не удалось собрать конфигурации.")
          EOF
          python3 process_subs.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Update verified working VPN configs [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
            git push
          fi
