name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://aistudio.google.com/prompts/new_chat"
  # Международные источники с VLESS Reality / Trojan / Shadowsocks
  URL_1: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"
  URL_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt"
  URL_3: "https://raw.githubusercontent.com/sevcator/5ubscrpt10n/main/protocols/vl.txt"
  URL_4: "https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/all_valid_proxies.txt"
  URL_5: "https://raw.githubusercontent.com/yitong2333/proxy-minging/refs/heads/main/v2ray.txt"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests pysocks urllib3

      - name: Install Xray-Knife
        run: |
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Fetch and Clean Raw Configs
        run: |
          cat << 'EOF' > fetch.py
          import base64
          import os
          import re
          import requests

          SOURCES = [
              os.environ.get("URL_1"),
              os.environ.get("URL_2"),
              os.environ.get("URL_3"),
              os.environ.get("URL_4"),
              os.environ.get("URL_5")
          ]

          # Только совместимые с V2Ray протоколы
          PROTO_REGEX = re.compile(r'^(vless|vmess|trojan|ss)://[^\s\'"<>]+', re.IGNORECASE)

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if any(PROTO_REGEX.match(line.strip()) for line in decoded.splitlines()):
                      return decoded
              except Exception:
                  pass
              return text

          all_configs = []
          for url in SOURCES:
              if not url:
                  continue
              try:
                  print(f"[*] Скачивание: {url}", flush=True)
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      content = decode_if_base64(resp.text)
                      count = 0
                      for line in content.splitlines():
                          line = line.strip()
                          if PROTO_REGEX.match(line):
                              all_configs.append(line)
                              count += 1
                      print(f"[+] Извлечено конфигов: {count}", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          # Дедупликация
          unique = []
          seen = set()
          for c in all_configs:
              if c not in seen:
                  seen.add(c)
                  unique.append(c)

          print(f"[+] Всего уникальных конфигураций для первичного скана: {len(unique)}", flush=True)
          with open("raw_candidates.txt", "w", encoding="utf-8") as f:
              for c in unique:
                  f.write(c + "\n")
          EOF
          python3 fetch.py

      - name: Stage 1 - Fast Prescan
        run: |
          if [ -s raw_candidates.txt ]; then
            echo "[*] Этап 1: Быстрый отсев неработающих узлов через xray-knife..."
            # Проверяем базовый доступ к гуглу для отсева мертвых соединений
            ./xray-knife http -f raw_candidates.txt \
              -t 50 \
              --test-urls "https://www.google.com/generate_204" \
              -o prescan_alive.txt || true
          fi

      - name: Stage 2 - Strict AI Studio & GeoIP Validation
        run: |
          cat << 'EOF' > deep_check.py
          import base64
          import concurrent.futures
          import os
          import re
          import socket
          import subprocess
          import sys
          import threading
          import time
          import requests
          import urllib3

          # Отключаем предупреждения SSL
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          AI_STUDIO_URL = "https://aistudio.google.com/prompts/new_chat"
          MAX_TARGET = 20
          CONCURRENCY = 8
          TIMEOUT = 7.0

          BLOCKED_COUNTRIES = {"RU", "BY", "IR", "CN", "CU", "KP", "SY", "VE"}
          ALLOWED_SCHEMES = ("vless://", "vmess://", "trojan://", "ss://")
          URI_REGEX = re.compile(r'((?:vless|vmess|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          def load_candidates():
              configs = []
              for fname in ["prescan_alive.txt", "raw_candidates.txt"]:
                  if os.path.exists(fname):
                      with open(fname, "r", encoding="utf-8", errors="ignore") as f:
                          for line in f:
                              matches = URI_REGEX.findall(line)
                              for c in matches:
                                  c = c.strip()
                                  if c.startswith(ALLOWED_SCHEMES) and c not in configs:
                                      configs.append(c)
              return configs

          def wait_for_port(port, timeout=2.5):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=0.15):
                          return True
                  except (socket.timeout, ConnectionRefusedError, OSError):
                      time.sleep(0.05)
              return False

          def start_proxy(config, port):
              for cmd in [
                  ["./xray-knife", "proxy", "inbound", "-c", config, "--port", str(port)],
                  ["./xray-knife", "proxy", "-c", config, "--port", str(port)]
              ]:
                  try:
                      proc = subprocess.Popen(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if wait_for_port(port, timeout=1.8):
                          return proc
                      proc.terminate()
                      proc.wait()
                  except Exception:
                      pass
              return None

          def format_time(seconds):
              m, s = divmod(int(seconds), 60)
              return f"{m:02d}:{s:02d}"

          # Глобальные переменные отслеживания прогресса
          working_configs = []
          processed_count = 0
          total_candidates = 0
          start_time = 0
          lock = threading.Lock()
          stop_event = threading.Event()

          def get_progress_prefix():
              elapsed = time.time() - start_time
              speed = processed_count / elapsed if elapsed > 0 else 0
              remaining_items = max(0, total_candidates - processed_count)
              eta_seconds = (remaining_items / speed) if speed > 0 else 0
              
              return (
                  f"[{processed_count:03d}/{total_candidates:03d} | "
                  f"Найдено: {len(working_configs):02d}/{MAX_TARGET:02d} | "
                  f"Прошло: {format_time(elapsed)} | "
                  f"ETA: {format_time(eta_seconds)}]"
              )

          def verify_config(item):
              global processed_count
              idx, config, worker_id = item
              
              if stop_event.is_set():
                  return

              port = 25000 + worker_id
              proc = start_proxy(config, port)

              status_msg = ""
              is_success = False

              if not proc:
                  status_msg = "[-] Не удалось запустить локальный сокс / битый конфиг"
              else:
                  proxies = {
                      'http': f'socks5h://127.0.0.1:{port}',
                      'https': f'socks5h://127.0.0.1:{port}'
                  }
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
                      'Accept-Language': 'en-US,en;q=0.9'
                  }

                  try:
                      # 1. Проверка страны
                      country = "UNKNOWN"
                      try:
                          geo = requests.get("https://api.country.is", proxies=proxies, timeout=3.5)
                          if geo.status_code == 200:
                              country = geo.json().get("country", "UNKNOWN").upper()
                      except Exception:
                          pass

                      if country in BLOCKED_COUNTRIES:
                          status_msg = f"[-] Отклонен: Геоблок по IP ({country})"
                      else:
                          # 2. Проверка Google AI Studio
                          req_start = time.time()
                          resp = requests.get(AI_STUDIO_URL, proxies=proxies, headers=headers, timeout=TIMEOUT, allow_redirects=True)
                          latency = int((time.time() - req_start) * 1000)

                          final_url = resp.url.lower()
                          body = resp.text.lower()

                          if resp.status_code in [200, 302]:
                              is_geoblocked = (
                                  "available_regions" in final_url or
                                  "available-regions" in final_url or
                                  "not available in your country" in body or
                                  "region is not supported" in body or
                                  ("restricted" in body and "google ai studio" in body)
                              )
                              if is_geoblocked:
                                  status_msg = f"[-] Отклонен: AI Studio вернул редирект/заглушку региона (Страна: {country})"
                              else:
                                  # 3. Gemini API чек
                                  api_chk = requests.get("https://generativelanguage.googleapis.com", proxies=proxies, timeout=3.5)
                                  if api_chk.status_code in [200, 404]:
                                      is_success = True
                                      status_msg = f"[+] РАБОТАЕТ ДЛЯ AI STUDIO! (Страна: {country}, Задержка: {latency}ms)"
                                  else:
                                      status_msg = f"[-] Отклонен: Gemini API недоступен (Код: {api_chk.status_code})"
                          else:
                              status_msg = f"[-] Отклонен: Код ответа AI Studio {resp.status_code}"
                  except requests.exceptions.Timeout:
                      status_msg = "[-] Отклонен: Таймаут соединения"
                  except Exception as e:
                      status_msg = f"[-] Отклонен: Ошибка сети ({type(e).__name__})"
                  finally:
                      proc.terminate()
                      try:
                          proc.wait(timeout=0.8)
                      except Exception:
                          proc.kill()

              with lock:
                  processed_count += 1
                  prefix = get_progress_prefix()
                  
                  if is_success:
                      if len(working_configs) < MAX_TARGET:
                          working_configs.append(config)
                          print(f"\n{prefix} 🌟 {status_msg}", flush=True)
                          if len(working_configs) >= MAX_TARGET:
                              print(f"\n[🎯] Целевой лимит в {MAX_TARGET} конфигураций достигнут! Прерываем сканирование...", flush=True)
                              stop_event.set()
                  else:
                      # Выводим подробный статус каждые несколько проверок или при успехе
                      print(f"{prefix} {status_msg}", flush=True)

          def main():
              global total_candidates, start_time
              candidates = load_candidates()
              total_candidates = len(candidates)
              start_time = time.time()

              print("=" * 80)
              print(f"[*] Старт глубокой валидации Google AI Studio")
              print(f"[*] Всего кандидатов: {total_candidates} | Цель: {MAX_TARGET} рабочих узлов | Потоков: {CONCURRENCY}")
              print("=" * 80, flush=True)

              if not candidates:
                  print("[!] Список кандидатов пуст.")
                  return

              tasks = [(i, c, i % CONCURRENCY) for i, c in enumerate(candidates)]

              with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
                  futures = [executor.submit(verify_config, t) for t in tasks]
                  for f in concurrent.futures.as_completed(futures):
                      if stop_event.is_set():
                          # Отменяем еще не начатые задачи
                          for pending in futures:
                              pending.cancel()
                          break

              total_elapsed = time.time() - start_time
              print("\n" + "=" * 80)
              print(f"[ИТОГ] Валидация завершена за {format_time(total_elapsed)}!")
              print(f"[ИТОГ] Проверено кандидатов: {processed_count}/{total_candidates}")
              print(f"[ИТОГ] Гарантированно рабочих для AI Studio: {len(working_configs)}/{MAX_TARGET}")
              print("=" * 80, flush=True)

              with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
                  for c in working_configs:
                      f.write(c + "\n")

              if working_configs:
                  b64_sub = base64.b64encode(("\n".join(working_configs) + "\n").encode('utf-8')).decode('utf-8')
                  with open("sub.txt", "w", encoding="utf-8") as f:
                      f.write(b64_sub)
              else:
                  open("sub.txt", "w").close()

          if __name__ == "__main__":
              main()
          EOF
          python3 deep_check.py
          

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Update guaranteed working AI Studio configs [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
            git push
          fi
