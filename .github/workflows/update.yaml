name: Auto Update Sub

on:
  schedule:
    - cron: '0 */4 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Configs from 6 Sources
        run: |
          touch public_raw.txt
        
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-SNI-RU-all.txt" >> public_raw.txt # delete if have other ideas

          grep -iE 'vless://|vmess://|trojan://|ss://|hysteria2://' public_raw.txt | sort | uniq > configs_to_test.txt

      - name: Setup Xray-Knife
        run: |
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Run Multi-Check (Super Strict + Speed Filter)
        run: |
          ./xray-knife http --file configs_to_test.txt \
                            --url "http://www.google.com/generate_204" \
                            --mdelay 1200 \
                            --thread 50 \
                            --out valid_pass1.txt || touch valid_pass1.txt
          
          if [ -s valid_pass1.txt ]; then
            ./xray-knife http --file valid_pass1.txt \
                              --url "https://aistudio.google.com/prompts/new_chat" \
                              --mdelay 1500 \
                              --thread 20 \
                              --out valid_final.txt || touch valid_final.txt
          fi

          if [ -s valid_final.txt ]; then
            head -n 10 valid_final.txt > best.txt
            cat best.txt | base64 -w 0 > sub.txt
          else
            head -n 10 valid_pass1.txt > best.txt 2>/dev/null || echo "" > best.txt
            cat best.txt | base64 -w 0 > sub.txt
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f sub.txt ]; then
            git add sub.txt
            git commit -m "Update Mode 6-Sources Update: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
            git push
          fi
