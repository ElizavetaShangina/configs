Этап 1 (Go-слой): Утилита xray-knife «пролетает» по всем 17 000 конфигов лавиной в 300 параллельных потоков. Она мгновенно отбрасывает всё, что лежит, не пингуется или отвечает дольше 1.2 секунды. На выходе мы получаем файл pre_valid.txt. 

