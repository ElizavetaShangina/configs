name: Auto Update Sub

on:
  schedule:
    - cron: '0 */1 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests PySocks

      - name: Download Configs from Sources
        run: |
          touch public_raw.txt
          # Скачиваем абсолютно ВСЕ файлы без обрезки строк
          wget -qO- "https://githubusercontent.com" >> public_raw.txt
          wget -qO- "https://github.com" >> public_raw.txt
          wget -qO- "https://github.com" >> public_raw.txt
          wget -qO- "https://github.com" >> public_raw.txt
          wget -qO- "https://githubusercontent.com" >> public_raw.txt
          wget -qO- "https://githubusercontent.com" >> public_raw.txt
          wget -qO- "https://githubusercontent.com" >> public_raw.txt
          wget -qO- "https://githubusercontent.com" >> public_raw.txt

      - name: Setup Xray-Knife
        run: |
          URL=$(curl -s https://github.com | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Real Proxy Validation (Strict Anti-DPI)
        run: |
          cat << 'EOF' > deep_validate.py
          import subprocess
          import time
          import requests
          import os
          import sys

          # Читаем все конфигурации без потери символов
          if not os.path.exists("public_raw.txt"):
              print("[!] Файл с конфигурациями пуст.")
              sys.exit(0)

          with open("public_raw.txt", "r", encoding="utf-8", errors="ignore") as f:
              all_configs = [line.strip() for line in f if line.strip() and (line.startswith("vless://") or line.startswith("vmess://") or line.startswith("ss://") or line.startswith("trojan://"))]

          # Убираем дубликаты, сохраняя исходный порядок (сначала идут свежие списки для РФ)
          seen = set()
          unique_configs = []
          for c in reversed(all_configs): # Переворачиваем, чтобы специфичные для РФ базы проверились первыми
              if c not in seen:
                  seen.add(c)
                  unique_configs.append(c)

          print(f"[-] Всего уникальных валидных ссылок найдено: {len(unique_configs)}")

          real_working = []
          socks_port = 19999

          # Используем заблокированный в РФ сайт для проверки честного обхода DPI
          # Ему также отправляем кастомный заголовок, чтобы подтвердить, что это не прямой пропуск
          TEST_URL = "https://linkedin.com" 

          for idx, config in enumerate(unique_configs):
              # Запускаем локальный клиент xray для этой конкретной ссылки
              proc = subprocess.Popen(
                  ["./xray-knife", "proxy", "-c", config, "--port", str(socks_port)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )
              
              # Ожидаем инициализации портов ядра
              time.sleep(0.8)

              proxies = {
                  'http': f'socks5h://127.0.0.1:{socks_port}',
                  'https': f'socks5h://127.0.0.1:{socks_port}'
              }

              is_valid = False
              try:
                  # Строгий запрос. Если туннель не рабочий — он упадет по таймауту.
                  # Если туннель "пропускает" напрямую — linkedin выдаст специфичную ошибку или не верифицируется.
                  response = requests.get(TEST_URL, proxies=proxies, timeout=2.5, allow_redirects=True)
                  
                  if response.status_code in:
                      is_valid = True
                      print(f"[+] Ссылка {idx+1} полностью РАБОТАЕТ и обходит DPI.")
              except Exception:
                  pass

              # Закрываем туннель текущей конфигурации
              proc.terminate()
              proc.wait()

              if is_valid:
                  real_working.append(config)
                  if len(real_working) >= 30: # Нам нужно 30 идеальных ссылок в подписку
                      break

          # Записываем результат строго в исходном формате ссылок
          with open("best.txt", "w", encoding="utf-8") as f:
              for conf in real_working:
                  f.write(conf + "\n")
                  
          print(f"[#] Валидация завершена. Найдено рабочих: {len(real_working)}")
          EOF
          python3 deep_validate.py

      - name: Base64 Encode Output
        run: |
          if [ -f best.txt ] && [ -s best.txt ]; then
            cat best.txt | base64 -w 0 > sub.txt
            echo "[+] sub.txt успешно обновлен."
          else
            echo "[!] Рабочих конфигураций не найдено."
            touch sub.txt
          fi
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s sub.txt ]; then
            git add sub.txt
            git commit -m "Update: $(date +'%Y-%m-%d %H:%M') [Fixed Links & Strict Route Test]" || echo "No changes"
            git push
          fi
