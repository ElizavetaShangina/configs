Этап 2 (Срез лучших): Python-скрипт не трогает терабайты мусора. Он берет только первые 150 самых быстрых конфигураций из отсортированного списка.
Этап 3 (Python-слой): Скрипт запускает ThreadPoolExecutor (20 параллельных рабочих мест) и одновременно тестирует эти 150 кандидатов на жесткий ответ от GitHub. Как только скрипт находит 25 железно рабочих конфигов, выполнение сразу прерывается (break), сохраняя результат и завершая работу воркфлоу, чтобы не тратить минуты GitHub Actions впустую.
Если вы захотите собирать больше, чем 25 штук — просто измените значение в строке if len(real_working) >= 25: на нужное вам число.





