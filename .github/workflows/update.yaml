name: Auto Update Sub

on:
  schedule:
    - cron: '0 */1 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://aistudio.google.com/prompts/new_chat"
  URL_1: "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt"
  URL_2: "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/1.txt"
  URL_3: "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/6.txt"
  URL_4: "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/25.txt"
  URL_5: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt"
  URL_6: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt"
  URL_7: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"
  URL_8: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests PySocks

      - name: Download Configs from Sources
        run: |
          touch public_raw.txt
          wget -qO- "$URL_1" >> public_raw.txt
          wget -qO- "$URL_2" >> public_raw.txt
          wget -qO- "$URL_3" >> public_raw.txt
          wget -qO- "$URL_4" >> public_raw.txt
          wget -qO- "$URL_5" >> public_raw.txt
          wget -qO- "$URL_6" >> public_raw.txt
          wget -qO- "$URL_7" >> public_raw.txt
          wget -qO- "$URL_8" >> public_raw.txt

      - name: Setup Xray-Knife
        run: |
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Real Proxy Validation (Google AI Studio Strict Check)
        run: |
          cat << 'EOF' > deep_validate.py
          import subprocess
          import time
          import requests
          import os
          import sys

          if not os.path.exists("public_raw.txt"):
              print("[!] Файл с конфигурациями пуст.")
              sys.exit(0)

          # Читаем абсолютно все строки без изменения их структуры
          with open("public_raw.txt", "r", encoding="utf-8", errors="ignore") as f:
              all_configs = [line.strip() for line in f if line.strip()]

          # Удаляем дубликаты, сохраняя оригинальный порядок (базы РФ в приоритете)
          seen = set()
          unique_configs = []
          for c in reversed(all_configs):
              if c not in seen:
                  seen.add(c)
                  unique_configs.append(c)

          print(f"[-] Всего уникальных строк для проверки: {len(unique_configs)}")

          real_working = []
          socks_port = 19999
          TEST_URL = os.environ.get("TARGET_SITE", "https://aistudio.google.com/prompts/new_chat")

          for idx, config in enumerate(unique_configs):
              # Запуск xray-knife в режиме фонового SOCKS5-прокси
              proc = subprocess.Popen(
                  ["./xray-knife", "proxy", "-c", config, "--port", str(socks_port)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )
              
              # Пауза для инициализации портов ядра Xray
              time.sleep(0.8)

              proxies = {
                  'http': f'socks5h://127.0.0.1:{socks_port}',
                  'https': f'socks5h://127.0.0.1:{socks_port}'
              }

              headers = {
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              }

              is_valid = False
              try:
                  # Запрос идет строго по редиректам до финальной точки
                  response = requests.get(TEST_URL, proxies=proxies, headers=headers, timeout=4.5, allow_redirects=True)
                  
                  final_url = response.url.lower()
                  page_content = response.text.lower()
                  
                  # КРИТЕРИЙ УСПЕХА:
                  # 1. Мы достучались до инфраструктуры Google (200 OK или редирект на Sign In аккаунтов)
                  # 2. В итоговом URL или тексте нет признаков "available-regions"
                  if response.status_code == 200:
                      if "available-regions" not in final_url and "available_regions" not in page_content and "not available" not in page_content:
                          is_valid = True
                          print(f"[+] Конфиг {idx+1} РАБОТАЕТ и пускает в AI Studio!")
              except Exception:
                  pass

              # Тушим текущий инстанс прокси
              proc.terminate()
              proc.wait()

              if is_valid:
                  real_working.append(config)
                  if len(real_working) >= 25: # Собираем 25 лучших
                      break

          # Записываем чистые строки в файл best.txt
          with open("best.txt", "w", encoding="utf-8") as f:
              for conf in real_working:
                  f.write(conf + "\n")
                  
          print(f"[#] Валидация завершена. Найдено рабочих прокси: {len(real_working)}")
          EOF
          python3 deep_validate.py

      - name: Base64 Encode Output
        run: |
          if [ -f best.txt ] && [ -s best.txt ]; then
            cat best.txt | base64 -w 0 > sub.txt
            echo "[+] Файл sub.txt успешно обновлен."
          else
            echo "[!] В этих списках не найдено прокси, обходящих геоблок Google."
            touch sub.txt
          fi
          
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s sub.txt ]; then
            git add sub.txt
            git commit -m "Update: $(date +'%Y-%m-%d %H:%M') [Strict AI Studio Proxy Filter]" || echo "No changes"
            git push
          fi
