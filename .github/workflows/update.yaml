name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests pysocks urllib3

      - name: Install Official Xray-Core
        run: |
          echo "[*] Установка Xray-core..."
          wget -qO xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -o xray.zip -d xray_bin
          mv xray_bin/xray ./xray
          chmod +x xray
          ./xray version

      - name: Fetch, MTProto-Validate & Build Subscriptions
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > run_validator.py
          import base64
          import concurrent.futures
          import datetime
          import json
          import os
          import random
          import re
          import socket
          import subprocess
          import sys
          import threading
          import time
          from urllib.parse import urlparse, parse_qs
          import socks
          import requests
          import urllib3

          socket.setdefaulttimeout(5.0)
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          AI_STUDIO_URL = "https://aistudio.google.com/prompts/new_chat"
          CONCURRENCY = 4

          # Базы от igareck и barry-far + топ-проверенные
          SOURCES = [
              # igareck
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt",
              # barry-far
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/vless.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub6.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub7.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub8.txt",
              # Top Verified Feeds
              "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/top100.txt",
              "https://raw.githubusercontent.com/yebekhe/TelegramV2rayCollector/main/sub/normal/reality"
          ]

          PROTO_REGEX = re.compile(r'((?:vless|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          # IP-адреса официальных дата-центров Telegram (куда подключаются клиенты Telegram Desktop и Mobile)
          TELEGRAM_DCS = [
              ("149.154.167.50", 443),  # DC2 (Европа / РФ основной)
              ("91.108.56.130", 443),   # DC5 (Азия)
              ("149.154.175.50", 443),  # DC1 (США)
              ("149.154.167.91", 443)   # DC4 (Европа резервный)
          ]

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if any(p in decoded for p in ["vless://", "trojan://", "ss://"]):
                      return decoded
              except Exception:
                  pass
              return text

          print("=" * 80)
          print("[1/3] СКАЧИВАНИЕ И ПОДГОТОВКА СЕРВЕРОВ...")
          print("=" * 80, flush=True)

          collected_nodes = set()
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      content = decode_if_base64(resp.text)
                      matches = PROTO_REGEX.findall(content)
                      count = 0
                      for m in matches:
                          m = m.strip()
                          clean_base = m.split("#")[0].strip()
                          if clean_base not in collected_nodes:
                              collected_nodes.add(m)
                              count += 1
                      source_name = "/".join(url.split("/")[-2:])
                      print(f"[+] {source_name}: извлечено {count} шт.", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка {url}: {e}", flush=True)

          candidates = list(collected_nodes)
          random.shuffle(candidates)
          print(f"\n[*] Итого уникальных серверов для теста: {len(candidates)}", flush=True)

          if not candidates:
              print("[!] Нет кандидатов.")
              sys.exit(0)

          def build_xray_config(link, socks_port):
              try:
                  clean = link.split("#")[0].strip()
                  p = urlparse(clean)
                  params = parse_qs(p.query)
                  proto = p.scheme.lower()
                  host = p.hostname
                  port = int(p.port)

                  inbound = {
                      "listen": "127.0.0.1",
                      "port": socks_port,
                      "protocol": "socks",
                      "settings": {"auth": "noauth", "udp": True}
                  }

                  if proto == "vless":
                      user = {"id": p.username, "encryption": "none"}
                      flow = params.get("flow", [""])[0]
                      net = params.get("type", ["tcp"])[0]

                      if flow:
                          user["flow"] = flow
                      elif net == "tcp" and "security=reality" in clean.lower():
                          user["flow"] = "xtls-rprx-vision"

                      stream = {"network": net}

                      if "security=reality" in clean.lower():
                          reality_settings = {
                              "show": False,
                              "fingerprint": params.get("fp", ["chrome"])[0],
                              "serverName": params.get("sni", [host])[0],
                              "publicKey": params.get("pbk", [""])[0]
                          }
                          if params.get("sid", [""])[0]:
                              reality_settings["shortId"] = params.get("sid")[0]
                          stream["security"] = "reality"
                          stream["realitySettings"] = reality_settings
                      elif "security=tls" in clean.lower():
                          stream["security"] = "tls"
                          stream["tlsSettings"] = {"serverName": params.get("sni", [host])[0]}

                      if net == "grpc":
                          srv = params.get("serviceName", [""])[0]
                          if srv:
                              stream["grpcSettings"] = {"serviceName": srv}

                      outbound = {
                          "protocol": "vless",
                          "settings": {"vnext": [{"address": host, "port": port, "users": [user]}]},
                          "streamSettings": stream
                      }
                  elif proto == "trojan":
                      outbound = {
                          "protocol": "trojan",
                          "settings": {"servers": [{"address": host, "port": port, "password": p.username}]},
                          "streamSettings": {
                              "network": params.get("type", ["tcp"])[0],
                              "security": "tls",
                              "tlsSettings": {"serverName": params.get("sni", [host])[0]}
                          }
                      }
                  else:
                      return None

                  return {
                      "log": {"loglevel": "none"},
                      "inbounds": [inbound],
                      "outbounds": [outbound]
                  }
              except Exception:
                  return None

          def wait_for_port(port, timeout=3.5):
              t0 = time.time()
              while time.time() - t0 < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=0.15):
                          return True
                  except Exception:
                      time.sleep(0.04)
              return False

          def test_telegram_native_dc(socks_port):
              """Тестирует прямое MTProto TCP-соединение с реальными дата-центрами Telegram."""
              for dc_ip, dc_port in TELEGRAM_DCS:
                  s = socks.socksocket()
                  s.set_proxy(socks.SOCKS5, "127.0.0.1", socks_port)
                  s.settimeout(3.5)
                  try:
                      s.connect((dc_ip, dc_port))
                      s.send(b"\xef")  # Инициализация MTProto
                      s.close()
                      return True, dc_ip
                  except Exception:
                      pass
                  finally:
                      try:
                          s.close()
                      except Exception:
                          pass
              return False, None

          verified_nodes = []
          lock = threading.Lock()
          tested_count = 0

          print("\n" + "=" * 80)
          print("[2/3] СКВОЗНОЙ MTPROTO ТЕСТ TELEGRAM DC + GOOGLE AI STUDIO...")
          print("=" * 80, flush=True)

          def test_worker(item):
              global tested_count
              idx, link, worker_id = item

              port = 31000 + worker_id
              cfg = build_xray_config(link, port)
              if not cfg:
                  return

              cfg_file = f"cfg_{worker_id}.json"
              with open(cfg_file, "w") as f:
                  json.dump(cfg, f)

              proc = None
              is_valid = False
              info_str = ""

              try:
                  proc = subprocess.Popen(["./xray", "run", "-c", cfg_file], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if not wait_for_port(port, timeout=3.0):
                      return

                  # 1. АППАРАТНЫЙ ТЕСТ TELEGRAM MTPROTO DC (ПРЯМОЙ TCP К ДАТА-ЦЕНТРАМ)
                  tg_ok, dc_used = test_telegram_native_dc(port)
                  if not tg_ok:
                      return

                  proxies = {
                      "http": f"socks5h://127.0.0.1:{port}",
                      "https": f"socks5h://127.0.0.1:{port}"
                  }
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                      "Accept-Language": "en-US,en;q=0.9"
                  }

                  # 2. ТЕСТ WEB TELEGRAM
                  tme_res = requests.get("https://t.me", proxies=proxies, timeout=3.5)
                  if tme_res.status_code != 200:
                      return

                  # 3. ТЕСТ GOOGLE AI STUDIO
                  t0 = time.time()
                  ai_res = requests.get(AI_STUDIO_URL, proxies=proxies, headers=headers, timeout=5.0, allow_redirects=True)
                  latency = int((time.time() - t0) * 1000)

                  final_url = ai_res.url.lower()
                  body = ai_res.text.lower()

                  if ai_res.status_code in [200, 302]:
                      if "available_regions" not in final_url and "available-regions" not in final_url and "not available in your country" not in body:
                          is_valid = True
                          p = urlparse(link.split("#")[0])
                          remark = link.split("#")[-1] if "#" in link else f"{p.hostname}:{p.port}"
                          info_str = f"Telegram DC: {dc_used} [OK] | AI Studio: {latency}ms [OK] | Узел: {remark}"
              except Exception:
                  pass
              finally:
                  if proc:
                      try:
                          proc.kill()
                          proc.wait(timeout=0.2)
                      except Exception:
                          pass
                  if os.path.exists(cfg_file):
                      try:
                          os.remove(cfg_file)
                      except Exception:
                          pass

              with lock:
                  tested_count += 1
                  if is_valid:
                      verified_nodes.append(link)
                      print(f"[🔥] [{len(verified_nodes):02d} РАБОТАЕТ] {info_str}", flush=True)

          # Берем первые 300 кандидатов для тестирования
          test_pool = [(i, c, i % CONCURRENCY) for i, c in enumerate(candidates[:300])]

          with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
              list(executor.map(test_worker, test_pool))

          now_str = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          print("\n" + "=" * 80)
          print(f"[3/3] ИТОГИ: Проверено {tested_count}, Найдено реально работающих: {len(verified_nodes)}")
          print("=" * 80, flush=True)

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              f.write(f"# Last Updated: {now_str} | Fully Working TG + AI: {len(verified_nodes)}\n")
              for c in verified_nodes:
                  f.write(c + "\n")

          if verified_nodes:
              b64_sub = base64.b64encode(("\n".join(verified_nodes) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_sub)
              print("[+] sub.txt и clean_configs.txt успешно сгенерированы.")
          else:
              open("sub.txt", "w").close()
              print("[!] В этом цикле узлов с поддержкой MTProto и AI Studio не найдено.")
          EOF
          python3 -u run_validator.py

      - name: Commit and Push to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase || true
          git add sub.txt clean_configs.txt
          git commit -m "Update verified TG MTProto & AI Studio sub [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || echo "No changes to commit"
          git push

      - name: Publish Instant-Release (Zero-Cache & Unblocked)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Обновление GitHub Release..."
          git tag -f latest
          git push origin latest -f || true
          gh release delete latest -y || true
          gh release create latest sub.txt clean_configs.txt \
            --title "Latest Verified TG MTProto & AI Studio Nodes" \
            --notes "Автоматическое обновление: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "[+] Релиз обновлен."
