name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Install Xray-Core
        run: |
          URL=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.assets[] | select(.name == "Xray-linux-64.zip") | .browser_download_url')
          wget -qO xray.zip "$URL"
          unzip -o xray.zip -d xray_bin
          mv xray_bin/xray ./xray
          chmod +x xray

      - name: Fetch, Filter (DPI-Bypass) and Randomize Nodes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > get_and_filter.py
          import base64
          import random
          import re
          import requests
          from urllib.parse import urlparse, parse_qs

          # Динамические агрегаторы, собирающие свежие узлы из сотен Telegram-каналов
          SOURCES = [
              "https://raw.githubusercontent.com/yebekhe/TelegramV2rayCollector/main/sub/normal/reality",
              "https://raw.githubusercontent.com/vfarid/v2ray-share/master/splitted/reality.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/splitted/reality.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/vless.txt"
          ]

          # Строгие регулярки для проверки SNI (домен должен быть похож на настоящий)
          DOMAIN_REGEX = re.compile(r'^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$')
          # Исключаем SNI, за которые в РФ часто прилетает блок или шейп
          BAD_SNI = {"google.com", "cloudflare.com", "speedtest.net", "workers.dev"}

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if "vless://" in decoded:
                      return decoded
              except Exception:
                  pass
              return text

          def is_survival_config(link):
              if not link.lower().startswith("vless://"):
                  return False
              if "security=reality" not in link.lower():
                  return False

              try:
                  p = urlparse(link)
                  params = parse_qs(p.query)
                  
                  # 1. ТСПУ часто режет нестандартные порты. Разрешаем только 443
                  if p.port != 443:
                      return False

                  # 2. Проверка SNI на реалистичность
                  sni = params.get("sni", [""])[0].lower()
                  if not sni or not DOMAIN_REGEX.match(sni):
                      return False
                  if any(bad in sni for bad in BAD_SNI):
                      return False

                  # 3. Отсекаем Иранские и подозрительные китайские домены
                  host = p.hostname.lower() if p.hostname else ""
                  if host.endswith(".ir") or host.endswith(".cn"):
                      return False

                  # 4. Протокол должен быть только TCP (xtls-rprx-vision) или gRPC
                  net = params.get("type", ["tcp"])[0]
                  if net not in ["tcp", "grpc"]:
                      return False

                  return True
              except Exception:
                  return False

          collected = set()
          for url in SOURCES:
              try:
                  print(f"[*] Скачивание свежих дампов: {url}", flush=True)
                  resp = requests.get(url, timeout=15)
                  if resp.status_code == 200:
                      text = decode_if_base64(resp.text)
                      matches = re.findall(r'(vless://[^\s\'"<>]+)', text, re.IGNORECASE)
                      for m in matches:
                          m = m.strip()
                          if is_survival_config(m):
                              collected.add(m)
              except Exception as e:
                  print(f"[!] Ошибка {url}: {e}")

          unique_list = list(collected)
          print(f"\n[*] Собрано и отфильтровано для РФ: {len(unique_list)} узлов.", flush=True)

          # САМОЕ ГЛАВНОЕ: Рандомизация! Чтобы каждый запуск давал новые узлы.
          random.shuffle(unique_list)

          # Оставляем 500 случайных кандидатов для тестирования
          with open("nodes_to_test.txt", "w", encoding="utf-8") as f:
              for c in unique_list[:500]:
                  f.write(c + "\n")
          EOF
          python3 get_and_filter.py

      - name: True End-to-End Test (AI Studio + Telegram)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > deep_test.py
          import base64
          import concurrent.futures
          import json
          import os
          import socket
          import subprocess
          import threading
          import time
          from urllib.parse import urlparse, parse_qs
          import requests
          import urllib3

          socket.setdefaulttimeout(4.0)
          urllib3.disable_warnings()

          TARGET_GOAL = 15
          CONCURRENCY = 15

          def build_xray_config(link, socks_port):
              try:
                  p = urlparse(link)
                  params = parse_qs(p.query)
                  
                  user_obj = {"id": p.username, "encryption": "none"}
                  flow = params.get("flow", [""])[0]
                  if flow: user_obj["flow"] = flow

                  stream = {
                      "network": params.get("type", ["tcp"])[0],
                      "security": "reality",
                      "realitySettings": {
                          "show": False,
                          "fingerprint": params.get("fp", ["chrome"])[0],
                          "serverName": params.get("sni", [p.hostname])[0],
                          "publicKey": params.get("pbk", [""])[0]
                      }
                  }
                  if params.get("sid", [""])[0]:
                      stream["realitySettings"]["shortId"] = params.get("sid")[0]
                  if stream["network"] == "grpc":
                      stream["grpcSettings"] = {"serviceName": params.get("serviceName", [""])[0]}

                  return {
                      "log": {"loglevel": "none"},
                      "inbounds": [{"listen": "127.0.0.1", "port": socks_port, "protocol": "socks", "settings": {"auth": "noauth", "udp": True}}],
                      "outbounds": [{"protocol": "vless", "settings": {"vnext": [{"address": p.hostname, "port": int(p.port), "users": [user_obj]}]}, "streamSettings": stream}]
                  }
              except Exception:
                  return None

          def check_node(item):
              idx, link, worker_id = item
              if stop_event.is_set(): return

              port = 30000 + worker_id
              cfg = build_xray_config(link, port)
              if not cfg: return

              cfg_path = f"cfg_{worker_id}.json"
              with open(cfg_path, "w") as f: json.dump(cfg, f)

              proc = None
              try:
                  proc = subprocess.Popen(["./xray", "run", "-c", cfg_path], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  time.sleep(0.5)
                  
                  proxies = {"http": f"socks5h://127.0.0.1:{port}", "https": f"socks5h://127.0.0.1:{port}"}
                  headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0 Safari/537.36"}

                  # 1. Быстрый тест на наличие реального интернета (отсеиваем мертвые за 1 сек)
                  fast_test = requests.get("https://1.1.1.1", proxies=proxies, timeout=3.0)
                  if fast_test.status_code != 200: return

                  # 2. Тест Telegram
                  tg = requests.get("https://api.telegram.org", proxies=proxies, timeout=3.0)
                  if tg.status_code not in [200, 404, 302]: return

                  # 3. Тест AI Studio
                  ai = requests.get("https://aistudio.google.com/prompts/new_chat", proxies=proxies, headers=headers, timeout=5.0, allow_redirects=True)
                  body, url = ai.text.lower(), ai.url.lower()

                  # Проверка геоблока
                  if ai.status_code in [200, 302] and "available_regions" not in url and "not available in your country" not in body:
                      with lock:
                          if len(working_nodes) < TARGET_GOAL:
                              working_nodes.append(link)
                              print(f"[🔥] [{len(working_nodes):02d}/{TARGET_GOAL:02d}] НАЙДЕН ТОПОВЫЙ УЗЕЛ! -> {urlparse(link).hostname}", flush=True)
                              if len(working_nodes) >= TARGET_GOAL:
                                  stop_event.set()
              except Exception:
                  pass
              finally:
                  if proc:
                      try: proc.kill()
                      except: pass

          working_nodes = []
          lock = threading.Lock()
          stop_event = threading.Event()

          with open("nodes_to_test.txt", "r") as f:
              candidates = [line.strip() for line in f if line.strip()]

          print("=" * 70)
          print(f"[*] СТАРТ ЖЕСТКОГО ТЕСТИРОВАНИЯ: {len(candidates)} случайных кандидатов...")
          print("=" * 70, flush=True)

          with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
              for _ in executor.map(check_node, [(i, c, i % CONCURRENCY) for i, c in enumerate(candidates)]):
                  if stop_event.is_set(): break

          print("\n[+] Тестирование завершено! Сохраняем результат...")
          with open("clean_configs.txt", "w") as f:
              for c in working_nodes: f.write(c + "\n")

          if working_nodes:
              with open("sub.txt", "w") as f:
                  f.write(base64.b64encode(("\n".join(working_nodes) + "\n").encode()).decode())
          else:
              open("sub.txt", "w").close()
          EOF
          python3 -u deep_test.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Ultra-Filtered Random Configs [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
            git push
          fi
