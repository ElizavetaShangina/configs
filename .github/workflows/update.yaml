name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Install Xray-Core (Direct Link - No API Limits)
        run: |
          echo "[*] Скачивание последней версии Xray-core..."
          wget -qO xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -o xray.zip -d xray_bin
          mv xray_bin/xray ./xray
          chmod +x xray
          echo "[+] Xray установлен успешно! Версия:"
          ./xray version

      - name: Fetch 10 Top Sources and Filter
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > get_candidates.py
          import base64
          import random
          import re
          import requests
          import sys
          from urllib.parse import urlparse, parse_qs

          SOURCES = [
              "https://raw.githubusercontent.com/yebekhe/TelegramV2rayCollector/main/sub/normal/reality",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/vless.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
              "https://raw.githubusercontent.com/VOID-Anonymity/V.O.I.D-VPN_Bypass/refs/heads/main/url_work.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/splitted/reality.txt",
              "https://raw.githubusercontent.com/w1770946466/Auto_proxy/main/Long_term_subscription_num",
              "https://raw.githubusercontent.com/Lexiie/all_proxy/main/file/vless.txt",
              "https://raw.githubusercontent.com/BoringCat/free-node/main/v2ray.txt",
              "https://raw.githubusercontent.com/tbbatbb/Proxy/master/main/vless",
              "https://raw.githubusercontent.com/vfarid/v2ray-share/master/splitted/reality.txt"
          ]

          # Мусорные SNI
          BAD_SNIS = {"google.com", "speedtest.net", "cloudflare.com", "workers.dev"}

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if "vless://" in decoded:
                      return decoded
              except Exception:
                  pass
              return text

          collected = set()

          print("=" * 70, flush=True)
          print("[*] СТАРТ СБОРА И ФИЛЬТРАЦИИ БАЗ", flush=True)
          print("=" * 70, flush=True)

          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      text = decode_if_base64(resp.text)
                      matches = re.findall(r'(vless://[^\s\'"<>]+)', text, re.IGNORECASE)
                      
                      found_in_source = 0
                      for m in matches:
                          # ОТРЕЗАЕМ ХЭШТЕГИ ПЕРЕД ПАРСИНГОМ
                          clean_link = m.split("#")[0].strip()
                          
                          if "security=reality" not in clean_link.lower():
                              continue
                              
                          try:
                              p = urlparse(clean_link)
                              host = p.hostname.lower() if p.hostname else ""
                              
                              if host.endswith(".ir") or host.endswith(".cn"):
                                  continue
                                  
                              params = parse_qs(p.query)
                              if not params.get("pbk"):
                                  continue
                                  
                              sni = params.get("sni", [""])[0].lower()
                              if any(bad in sni for bad in BAD_SNIS):
                                  continue

                              collected.add(m)
                              found_in_source += 1
                          except Exception:
                              pass
                      print(f"[+] {url.split('/')[-1]}: найдено {found_in_source} валидных", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка {url.split('/')[-1]}: {e}", flush=True)

          unique_list = list(collected)
          print(f"\n[*] Всего уникальных чистых кандидатов: {len(unique_list)}", flush=True)

          if not unique_list:
              print("[!] КРИТИЧЕСКАЯ ОШИБКА: Не найдено ни одного узла! Завершаем...", flush=True)
              sys.exit(0)

          # Рандомизация для разнообразия
          random.shuffle(unique_list)

          # Берем 800 штук для тестов
          with open("candidates.txt", "w", encoding="utf-8") as f:
              for c in unique_list[:800]:
                  f.write(c + "\n")
          print("[+] Файл candidates.txt успешно создан.", flush=True)
          EOF
          python3 get_candidates.py

      - name: True End-to-End Stress Test (TG + AI Studio)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ ! -f candidates.txt ] || [ ! -s candidates.txt ]; then
            echo "[!] Файл candidates.txt пуст или отсутствует. Пропускаем валидацию."
            exit 0
          fi

          cat << 'EOF' > validate.py
          import base64
          import concurrent.futures
          import json
          import os
          import socket
          import subprocess
          import threading
          import time
          from urllib.parse import urlparse, parse_qs
          import requests
          import urllib3

          socket.setdefaulttimeout(4.0)
          urllib3.disable_warnings()

          TARGET_GOAL = 15
          CONCURRENCY = 15

          def generate_xray_config(link, socks_port):
              try:
                  clean_link = link.split("#")[0].strip()
                  p = urlparse(clean_link)
                  params = parse_qs(p.query)
                  
                  user = {"id": p.username, "encryption": "none"}
                  flow = params.get("flow", [""])[0]
                  if flow: user["flow"] = flow

                  stream = {
                      "network": params.get("type", ["tcp"])[0],
                      "security": "reality",
                      "realitySettings": {
                          "show": False,
                          "fingerprint": params.get("fp", ["chrome"])[0],
                          "serverName": params.get("sni", [p.hostname])[0],
                          "publicKey": params.get("pbk", [""])[0]
                      }
                  }
                  if params.get("sid", [""])[0]:
                      stream["realitySettings"]["shortId"] = params.get("sid")[0]
                  if stream["network"] == "grpc":
                      stream["grpcSettings"] = {"serviceName": params.get("serviceName", [""])[0]}

                  return {
                      "log": {"loglevel": "none"},
                      "inbounds": [{"listen": "127.0.0.1", "port": socks_port, "protocol": "socks", "settings": {"auth": "noauth", "udp": True}}],
                      "outbounds": [{"protocol": "vless", "settings": {"vnext": [{"address": p.hostname, "port": int(p.port), "users": [user]}]}, "streamSettings": stream}]
                  }
              except Exception:
                  return None

          def worker(item):
              idx, link, w_id = item
              if stop_event.is_set(): return

              port = 30000 + w_id
              cfg = generate_xray_config(link, port)
              if not cfg: return

              cfg_file = f"x_{w_id}.json"
              with open(cfg_file, "w") as f: json.dump(cfg, f)

              proc = None
              try:
                  proc = subprocess.Popen(["./xray", "run", "-c", cfg_file], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  time.sleep(0.7) # Даем ядру запуститься
                  
                  proxies = {"http": f"socks5h://127.0.0.1:{port}", "https": f"socks5h://127.0.0.1:{port}"}
                  headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/126.0.0.0 Safari/537.36"}

                  # 1. ТЕСТ TELEGRAM
                  if requests.get("https://api.telegram.org", proxies=proxies, timeout=3.5).status_code not in [200, 302, 404]:
                      return

                  # 2. ТЕСТ AI STUDIO
                  t0 = time.time()
                  ai = requests.get("https://aistudio.google.com/prompts/new_chat", proxies=proxies, headers=headers, timeout=5.0, allow_redirects=True)
                  latency = int((time.time() - t0) * 1000)

                  # Исключаем геоблок
                  if "available_regions" not in ai.url.lower() and "not available in your country" not in ai.text.lower():
                      with lock:
                          if len(working) < TARGET_GOAL:
                              working.append(link)
                              name = link.split("#")[-1] if "#" in link else urlparse(link.split("#")[0]).hostname
                              print(f"[🔥] [{len(working):02d}/{TARGET_GOAL:02d}] РАБОТАЕТ! TG + Google | Пинг: {latency}ms | Узел: {name}", flush=True)
                              if len(working) >= TARGET_GOAL:
                                  stop_event.set()
              except Exception:
                  pass
              finally:
                  if proc:
                      try: proc.kill()
                      except: pass

          working = []
          lock = threading.Lock()
          stop_event = threading.Event()

          with open("candidates.txt", "r") as f:
              candidates = [line.strip() for line in f if line.strip()]

          print("\n" + "=" * 70, flush=True)
          print(f"[*] СТАРТ СКВОЗНОГО ТЕСТИРОВАНИЯ ({len(candidates)} узлов)", flush=True)
          print("=" * 70, flush=True)

          with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
              for _ in executor.map(worker, [(i, c, i % CONCURRENCY) for i, c in enumerate(candidates)]):
                  if stop_event.is_set(): break

          print(f"\n[+] Сохранено проверенных конфигураций: {len(working)}", flush=True)
          with open("clean
