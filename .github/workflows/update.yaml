name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://generativelanguage.googleapis.com"
  # Проверенные международные источники (без белых списков РФ)
  URL_1: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"
  URL_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt"
  URL_3: "https://raw.githubusercontent.com/sevcator/5ubscrpt10n/main/protocols/vl.txt"
  URL_4: "https://raw.githubusercontent.com/sakha1370/OpenRay/refs/heads/main/output/all_valid_proxies.txt"
  URL_5: "https://raw.githubusercontent.com/yitong2333/proxy-minging/refs/heads/main/v2ray.txt"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Install Xray-Knife
        run: |
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Fetch and Prepare Candidates
        run: |
          cat << 'EOF' > fetch.py
          import base64
          import os
          import re
          import requests

          SOURCES = [
              os.environ.get("URL_1"),
              os.environ.get("URL_2"),
              os.environ.get("URL_3"),
              os.environ.get("URL_4"),
              os.environ.get("URL_5")
          ]

          # Только поддерживаемые V2Ray клиентами схемы
          PROTO_REGEX = re.compile(r'^(vless|vmess|trojan|ss)://[^\s\'"<>]+', re.IGNORECASE)

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if any(PROTO_REGEX.match(line.strip()) for line in decoded.splitlines()):
                      return decoded
              except Exception:
                  pass
              return text

          all_configs = []
          for url in SOURCES:
              if not url:
                  continue
              try:
                  print(f"[*] Загрузка источника: {url}", flush=True)
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      content = decode_if_base64(resp.text)
                      count = 0
                      for line in content.splitlines():
                          line = line.strip()
                          if PROTO_REGEX.match(line):
                              all_configs.append(line)
                              count += 1
                      print(f"[+] Извлечено: {count} шт.", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          # Дедупликация
          unique = []
          seen = set()
          for c in all_configs:
              if c not in seen:
                  seen.add(c)
                  unique.append(c)

          print(f"[*] Всего уникальных конфигов для теста: {len(unique)}", flush=True)
          with open("candidates.txt", "w", encoding="utf-8") as f:
              for c in unique:
                  f.write(c + "\n")
          EOF
          python3 fetch.py

      - name: High-Speed AI Studio Native Validation
        run: |
          if [ -s candidates.txt ]; then
            echo "================================================================================"
            echo "[*] Запуск нативного тестирования Google AI Studio / Gemini API через xray-knife"
            echo "================================================================================"
            
            # Проверяем напрямую целевой API Google AI Studio с лимитом на 20 успешных
            ./xray-knife http -f candidates.txt \
              -t 40 \
              --timeout 4500 \
              --test-urls "${{ env.TARGET_SITE }}" \
              --max-passed 20 \
              -o xray_out.txt || true
          fi

      - name: Format Clean Subscription for V2Ray
        run: |
          cat << 'EOF' > make_sub.py
          import base64
          import os
          import re

          ALLOWED_SCHEMES = ("vless://", "vmess://", "trojan://", "ss://")
          URI_REGEX = re.compile(r'((?:vless|vmess|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          cleaned = []
          if os.path.exists("xray_out.txt"):
              with open("xray_out.txt", "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      matches = URI_REGEX.findall(line)
                      for m in matches:
                          m = m.strip()
                          if m.startswith(ALLOWED_SCHEMES) and m not in cleaned:
                              cleaned.append(m)

          # Ограничиваем первыми 20
          final_configs = cleaned[:20]

          print(f"\n================================================================================")
          print(f"[ИТОГ] Отобрано {len(final_configs)} гарантированно рабочих конфигураций для Google AI Studio!")
          print(f"================================================================================")

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in final_configs:
                  f.write(c + "\n")

          if final_configs:
              b64_sub = base64.b64encode(("\n".join(final_configs) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_sub)
              print("[+] sub.txt (Base64) и clean_configs.txt успешно созданы.")
          else:
              open("sub.txt", "w").close()
              print("[!] Рабочих конфигураций не обнаружено.")
          EOF
          python3 make_sub.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Update live Google AI Studio configs [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
            git push
          fi
