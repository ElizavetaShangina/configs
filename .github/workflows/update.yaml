name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests urllib3

      - name: Install Xray-Knife (Native Go Engine)
        run: |
          echo "[*] Загрузка Xray-knife..."
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife
          ./xray-knife version || true

      - name: Fetch Fresh Feeds (Barry-Far, SoliSpirit & Top Aggregators)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > fetch_top.py
          import base64
          import random
          import re
          import requests
          from urllib.parse import urlparse

          # Крупнейшие постоянно обновляемые репозитории (каждые 15-30 мин)
          SOURCES = [
              # SoliSpirit
              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/all_configs.txt",
              "https://raw.githubusercontent.com/SoliSpirit/v2ray-configs/main/vless.txt",
              # Barry-Far
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Splitted-By-Protocol/vless.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub1.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/main/Sub6.txt",
              # Epodonios & Yebekhe & Mahdibland
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/raw/main/All_Configs_Sub.txt",
              "https://raw.githubusercontent.com/yebekhe/TelegramV2rayCollector/main/sub/normal/reality",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/splitted/reality.txt"
          ]

          PROTO_REGEX = re.compile(r'((?:vless|vmess|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if any(p in decoded for p in ["vless://", "vmess://", "trojan://", "ss://"]):
                      return decoded
              except Exception:
                  pass
              return text

          collected = set()
          print("=" * 70, flush=True)
          print("[*] СБОР СВЕЖИХ БАЗ (barry-far, SoliSpirit, yebekhe, Epodonios)", flush=True)
          print("=" * 70, flush=True)

          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      text = decode_if_base64(resp.text)
                      matches = PROTO_REGEX.findall(text)
                      count = 0
                      for m in matches:
                          m = m.strip()
                          # Отсекаем явные ошибки и заведомо заблокированные домены
                          clean_base = m.split("#")[0].strip()
                          if clean_base not in collected:
                              collected.add(m)
                              count += 1
                      source_name = "/".join(url.split("/")[-3:])
                      print(f"[+] {source_name}: извлечено {count} шт.", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          unique_list = list(collected)
          print(f"\n[*] Итого уникальных узлов для тестирования: {len(unique_list)}", flush=True)

          # Перемешиваем случайным образом, чтобы тестировать разные серверы
          random.shuffle(unique_list)

          # Берем срез из 600 кандидатов на тест
          with open("candidates.txt", "w", encoding="utf-8") as f:
              for c in unique_list[:600]:
                  f.write(c + "\n")
          EOF
          python3 fetch_top.py

      - name: Real Payload Verification (Cloudflare Trace)
        run: |
          if [ -s candidates.txt ]; then
            echo "================================================================================"
            echo "[*] Тестирование реального сквозного трафика (цель: до 25 рабочих узлов)..."
            echo "================================================================================"
            
            ./xray-knife http -f candidates.txt \
              -t 30 \
              --timeout 3500 \
              --test-urls "https://cloudflare.com/cdn-cgi/trace" \
              --max-passed 25 \
              -o passed_raw.txt || true
          fi

      - name: Build Clean Subscriptions
        run: |
          cat << 'EOF' > make_sub.py
          import base64
          import os
          import re

          PROTO_REGEX = re.compile(r'((?:vless|vmess|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          cleaned = []
          seen_hosts = set()

          if os.path.exists("passed_raw.txt"):
              with open("passed_raw.txt", "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      matches = PROTO_REGEX.findall(line)
                      for m in matches:
                          m = m.strip()
                          clean_base = m.split("#")[0].strip()
                          if clean_base not in seen_hosts:
                              seen_hosts.add(clean_base)
                              cleaned.append(m)

          final_configs = cleaned[:25]

          print("\n" + "=" * 70)
          print(f"[ИТОГ] Успешно отобрано {len(final_configs)} гарантированно РАБОЧИХ серверов!")
          print("=" * 70)

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in final_configs:
                  f.write(c + "\n")

          if final_configs:
              b64_sub = base64.b64encode(("\n".join(final_configs) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_sub)
              print("[+] sub.txt и clean_configs.txt успешно записаны.")
          else:
              open("sub.txt", "w").close()
              print("[!] Рабочие узлы не обнаружены.")
          EOF
          python3 make_sub.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Update working proxies [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
            git push
          fi

      - name: Purge jsDelivr CDN Cache
        run: |
          echo "[*] Сброс кэша CDN..."
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/sub.txt" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/clean_configs.txt" || true
          echo "[+] Кэш успешно сброшен."
