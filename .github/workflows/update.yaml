name: Auto Update Sub

on:
  schedule:
    - cron: '0 */1 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://aistudio.google.com/prompts/new_chat"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Configs from Sources
        run: |
          touch public_raw.txt
          wget -q0- "https://raw.githubusercontent.com/barry-far/V2ray-config/main/All_Configs_Sub.txt" >> public_raw.txt
          wget -q0- "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/1.txt" >> public_raw.txt
          wget -q0- "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/6.txt" >> public_raw.txt
          wget -q0- "https://github.com/AvenCores/goida-vpn-configs/raw/refs/heads/main/githubmirror/25.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt" >> public_raw.txt
          
          grep -iE 'hysteria2://|hy2://|tuic://|vless://' public_raw.txt > step1.txt
          grep -viE 'vk.ru|cloud-vk|sbrf|max.ru|x5.ru|yandex|mail.ru|wb.ru|ozon|tinkoff|alfabank' step1.txt > step2.txt
          grep -iE 'hysteria2://|hy2://|tuic://|security=reality|security=tls' step2.txt | sort | uniq > configs_to_test.txt
      

      - name: Setup Xray-Knife
        run: |
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Run Test on Resistant Configs
        run: |
          ./xray-knife http --file configs_to_test.txt \
                            --url "${{ env.TARGET_SITE }}" \
                            --mdelay 2500 \
                            --thread 50 \
                            --out valid_target.txt || touch valid_target.txt

          if [ -s valid_target.txt ]; then
            head -n 10 valid_target.txt > best.txt
            cat best.txt | base64 -w 0 > sub.txt
          else
            grep -iE 'hysteria2://|hy2://' configs_to_test.txt | head -n 5 > best.txt || touch best.txt
            cat best.txt | base64 -w 0 > sub.txt
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f sub.txt ]; then
            git add sub.txt
            git commit -m "Update: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
            git push
          fi
