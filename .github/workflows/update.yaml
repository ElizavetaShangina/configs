name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests urllib3

      - name: Install Sing-box Engine
        run: |
          TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          VERSION=${TAG#v}
          wget -qO sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          mv sing-box-${VERSION}-linux-amd64/sing-box ./sing-box
          chmod +x sing-box

      - name: Fetch Pure VLESS Reality Sources
        run: |
          cat << 'EOF' > fetch_reality.py
          import base64
          import re
          import requests
          from urllib.parse import urlparse, parse_qs

          SOURCES = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt",
              "https://raw.githubusercontent.com/vfarid/v2ray-share/master/splitted/reality.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/splitted/reality.txt"
          ]

          def decode_if_base64(text):
              try:
                  dec = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if "vless://" in dec:
                      return dec
              except Exception:
                  pass
              return text

          valid_configs = []
          for url in SOURCES:
              try:
                  print(f"[*] Загрузка: {url}", flush=True)
                  res = requests.get(url, timeout=12)
                  if res.status_code == 200:
                      text = decode_if_base64(res.text)
                      for line in text.splitlines():
                          line = line.strip()
                          if line.startswith("vless://") and "security=reality" in line.lower():
                              parsed = urlparse(line)
                              params = parse_qs(parsed.query)
                              # Строгая проверка параметров Reality
                              if params.get("pbk") and parsed.hostname and parsed.port:
                                  valid_configs.append(line)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          # Дедупликация по IP:PORT
          unique = []
          seen = set()
          for c in valid_configs:
              parsed = urlparse(c)
              key = f"{parsed.hostname}:{parsed.port}"
              if key not in seen:
                  seen.add(key)
                  unique.append(c)

          print(f"[+] Собрано уникальных Reality кандидатов: {len(unique)}", flush=True)
          with open("candidates.txt", "w", encoding="utf-8") as f:
              for c in unique:
                  f.write(c + "\n")
          EOF
          python3 fetch_reality.py

      - name: True Tunnel & AI Studio Deep Verification
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > deep_validator.py
          import base64
          import concurrent.futures
          import json
          import os
          import re
          import socket
          import subprocess
          import sys
          import threading
          import time
          from urllib.parse import urlparse, parse_qs, unquote
          import requests
          import urllib3

          socket.setdefaulttimeout(4.0)
          urllib3.disable_warnings()

          TARGET_AI_STUDIO = "https://aistudio.google.com/prompts/new_chat"
          MAX_WINNERS = 20
          CONCURRENCY = 10
          BLOCKED_COUNTRIES = {"RU", "BY", "IR", "CN", "CU", "KP"}

          # Получаем реальный IP раннера GitHub, чтобы выявлять фейковые fallback-туннели
          RUNNER_IP = ""
          try:
              RUNNER_IP = requests.get("http://api.ipify.org", timeout=3.0).text.strip()
          except Exception:
              pass
          print(f"[*] IP раннера GitHub Actions: {RUNNER_IP}")

          def parse_vless_to_singbox(link, local_port):
              try:
                  parsed = urlparse(link)
                  params = parse_qs(parsed.query)
                  
                  uuid = parsed.username
                  server = parsed.hostname
                  port = int(parsed.port)
                  flow = params.get("flow", [""])[0]
                  pbk = params.get("pbk", [""])[0]
                  sid = params.get("sid", [""])[0]
                  sni = params.get("sni", [server])[0]
                  fp = params.get("fp", ["chrome"])[0]

                  config = {
                      "log": {"disabled": True},
                      "inbounds": [
                          {
                              "type": "socks",
                              "tag": "socks-in",
                              "listen": "127.0.0.1",
                              "listen_port": local_port
                          }
                      ],
                      "outbounds": [
                          {
                              "type": "vless",
                              "tag": "proxy",
                              "server": server,
                              "server_port": port,
                              "uuid": uuid,
                              "flow": flow,
                              "tls": {
                                  "enabled": True,
                                  "server_name": sni,
                                  "utls": {"enabled": True, "fingerprint": fp},
                                  "reality": {
                                      "enabled": True,
                                      "public_key": pbk,
                                      "short_id": sid
                                  }
                              }
                          }
                      ]
                  }
                  return config
              except Exception:
                  return None

          def wait_for_port(port, timeout=1.5):
              start = time.time()
              while time.time() - start < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=0.1):
                          return True
                  except Exception:
                      time.sleep(0.03)
              return False

          def test_node(item):
              idx, link, worker_id = item
              if stop_event.is_set():
                  return

              port = 30000 + worker_id
              sb_config = parse_vless_to_singbox(link, port)
              if not sb_config:
                  return

              cfg_path = f"sb_{worker_id}.json"
              with open(cfg_path, "w") as f:
                  json.dump(sb_config, f)

              proc = None
              try:
                  proc = subprocess.Popen(["./sing-box", "run", "-c", cfg_path], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if not wait_for_port(port, timeout=1.2):
                      return

                  proxies = {
                      "http": f"socks5h://127.0.0.1:{port}",
                      "https": f"socks5h://127.0.0.1:{port}"
                  }

                  # 1. ТЕСТ НА РЕАЛЬНЫЙ ТУННЕЛЬ (Отсекаем Reality Fallback)
                  exit_ip = ""
                  country = "UNKNOWN"
                  try:
                      ip_res = requests.get("http://api.ipify.org", proxies=proxies, timeout=3.0)
                      if ip_res.status_code == 200:
                          exit_ip = ip_res.text.strip()
                  except Exception:
                      return

                  # Если вернулся IP самого раннера или пустота — туннель не работает!
                  if not exit_ip or exit_ip == RUNNER_IP:
                      return

                  # 2. ТЕСТ GEOIP
                  try:
                      geo = requests.get(f"https://ipapi.co/{exit_ip}/country/", proxies=proxies, timeout=3.0)
                      if geo.status_code == 200:
                          country = geo.text.strip().upper()
                  except Exception:
                      pass

                  if country in BLOCKED_COUNTRIES:
                      return

                  # 3. СТРОГИЙ ТЕСТ GOOGLE AI STUDIO
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                  }
                  
                  t0 = time.time()
                  resp = requests.get(TARGET_AI_STUDIO, proxies=proxies, headers=headers, timeout=5.0, allow_redirects=True)
                  ping = int((time.time() - t0) * 1000)

                  final_url = resp.url.lower()
                  body = resp.text.lower()

                  # Проверяем отсутствие региональных блокировок
                  if resp.status_code in [200, 302]:
                      if "available_regions" not in final_url and "available-regions" not in final_url and "not available in your country" not in body:
                          with lock:
                              if len(working) < MAX_WINNERS:
                                  working.append(link)
                                  print(f"[+] [{len(working)}/{MAX_WINNERS}] НАСТОЯЩИЙ РАБОЧИЙ ПРОКСИ! Страна: {country} | IP: {exit_ip} | Пинг: {ping}ms", flush=True)
                                  if len(working) >= MAX_WINNERS:
                                      stop_event.set()
              except Exception:
                  pass
              finally:
                  if proc:
                      try:
                          proc.kill()
                          proc.wait(timeout=0.2)
                      except Exception:
                          pass
                  if os.path.exists(cfg_path):
                      try:
                          os.remove(cfg_path)
                      except Exception:
                          pass

          working = []
          lock = threading.Lock()
          stop_event = threading.Event()

          with open("candidates.txt", "r", encoding="utf-8") as f:
              candidates = [line.strip() for line in f if line.strip()]

          print(f"[*] Запуск жесткой валидации туннелей на {len(candidates)} кандидатах...", flush=True)
          tasks = [(i, c, i % CONCURRENCY) for i, c in enumerate(candidates)]

          with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
              futures = [executor.submit(test_node, t) for t in tasks]
              for f in concurrent.futures.as_completed(futures):
                  if stop_event.is_set():
                      break

          print(f"\n[#] Валидация завершена! Найдено 100% подтвержденных рабочих узлов: {len(working)}", flush=True)

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in working:
                  f.write(c + "\n")

          if working:
              b64_data = base64.b64encode(("\n".join(working) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_data)
          else:
              open("sub.txt", "w").close()
          EOF
          python3 -u deep_validator.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Verified Working Reality Configs [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
            git push
          fi
