name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests pysocks urllib3

      - name: Install Official Xray-Core Engine
        run: |
          echo "[*] Загрузка официального ядра Xray-core..."
          wget -qO xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -o xray.zip -d xray_bin
          mv xray_bin/xray ./xray
          chmod +x xray
          ./xray version

      - name: Execute Strict 5-Stage Verification Engine
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > strict_validator.py
          import base64
          import concurrent.futures
          import datetime
          import json
          import os
          import random
          import re
          import socket
          import subprocess
          import sys
          import threading
          import time
          from urllib.parse import urlparse, parse_qs
          import socks
          import requests
          import urllib3

          socket.setdefaulttimeout(5.0)
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          AI_STUDIO_URL = "https://aistudio.google.com/prompts/new_chat"
          CONCURRENCY = 4 # Оптимально для 2 vCPU runner

          # Проверенные источники (igareck, barry-far, 0xRadikal, yebekhe, Au1rxx)
          SOURCES = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt",
              "https://raw.githack.com/igareck/vpn-configs-for-russia/main/BLACK_SS%2BAll_RUS.txt",
              "https://raw.githack.com/igareck/vpn-configs-for-russia/main/TOR-BRIDGES/TOR_BRIDGES_ALL.txt",
              "https://raw.githack.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-all.txt"
          ]

          BLOCKED_COUNTRIES = {"RU", "BY", "IR", "CN", "KP", "CU", "SY"}
          BLOCKED_ORGS = [
              "cloudflare", "fastly", "cloudfront",
              "irancell", "mci", "asiatech", "telecommunication company of iran",
              "mcci", "mobile telecommunication", "afranet", "pars online"
          ]
          BAD_SNIS = {"google.com", "speedtest.net", "cloudflare.com", "workers.dev", "yahoo.com"}
          PROTO_REGEX = re.compile(r'((?:vless|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          # Получаем собственный IP раннера для выявления Fallback-обманок
          RUNNER_IP = ""
          try:
              RUNNER_IP = requests.get("http://api.ipify.org", timeout=3.0).text.strip()
          except Exception:
              pass

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if any(p in decoded for p in ["vless://", "trojan://", "ss://"]):
                      return decoded
              except Exception:
                  pass
              return text

          def is_clean_candidate(link):
              try:
                  clean = link.split("#")[0].strip()
                  p = urlparse(clean)
                  if not p.hostname or not p.port:
                      return False
                  host = p.hostname.lower()
                  if host.endswith(".ir") or host.endswith(".cn") or host.endswith(".ru"):
                      return False
                  params = parse_qs(p.query)
                  sni = params.get("sni", [""])[0].lower()
                  if any(bad in sni for bad in BAD_SNIS):
                      return False
                  if "security=reality" in clean.lower() and not params.get("pbk"):
                      return False
                  return True
              except Exception:
                  return False

          print("=" * 80)
          print(f"[1/3] СБОР КАНДИДАТОВ ИЗ ВСЕХ БАЗ (IP раннера: {RUNNER_IP})...")
          print("=" * 80, flush=True)

          collected_nodes = set()
          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      content = decode_if_base64(resp.text)
                      matches = PROTO_REGEX.findall(content)
                      count = 0
                      for m in matches:
                          m = m.strip()
                          if is_clean_candidate(m):
                              clean_base = m.split("#")[0].strip()
                              if clean_base not in collected_nodes:
                                  collected_nodes.add(m)
                                  count += 1
                      source_name = "/".join(url.split("/")[-2:])
                      print(f"[+] {source_name}: отобрано {count} шт.", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка {url}: {e}", flush=True)

          candidates = list(collected_nodes)
          random.shuffle(candidates)
          print(f"\n[*] Всего уникальных кандидатов для 5-ступенчатого теста: {len(candidates)}", flush=True)

          if not candidates:
              print("[!] Кандидатов не найдено.")
              sys.exit(0)

          def build_xray_config(link, socks_port):
              try:
                  clean = link.split("#")[0].strip()
                  p = urlparse(clean)
                  params = parse_qs(p.query)
                  proto = p.scheme.lower()
                  host = p.hostname
                  port = int(p.port)

                  inbound = {
                      "listen": "127.0.0.1",
                      "port": socks_port,
                      "protocol": "socks",
                      "settings": {"auth": "noauth", "udp": True}
                  }

                  if proto == "vless":
                      user = {"id": p.username, "encryption": "none"}
                      flow = params.get("flow", [""])[0]
                      net = params.get("type", ["tcp"])[0]

                      if flow:
                          user["flow"] = flow
                      elif net == "tcp" and "security=reality" in clean.lower():
                          user["flow"] = "xtls-rprx-vision"

                      stream = {"network": net}

                      if "security=reality" in clean.lower():
                          reality_settings = {
                              "show": False,
                              "fingerprint": params.get("fp", ["chrome"])[0],
                              "serverName": params.get("sni", [host])[0],
                              "publicKey": params.get("pbk", [""])[0]
                          }
                          if params.get("sid", [""])[0]:
                              reality_settings["shortId"] = params.get("sid")[0]
                          stream["security"] = "reality"
                          stream["realitySettings"] = reality_settings
                      elif "security=tls" in clean.lower():
                          stream["security"] = "tls"
                          stream["tlsSettings"] = {
                              "serverName": params.get("sni", [host])[0],
                              "fingerprint": params.get("fp", ["chrome"])[0]
                          }

                      if net == "grpc":
                          srv = params.get("serviceName", [""])[0]
                          if srv:
                              stream["grpcSettings"] = {"serviceName": srv}

                      outbound = {
                          "protocol": "vless",
                          "settings": {"vnext": [{"address": host, "port": port, "users": [user]}]},
                          "streamSettings": stream
                      }
                  elif proto == "trojan":
                      outbound = {
                          "protocol": "trojan",
                          "settings": {"servers": [{"address": host, "port": port, "password": p.username}]},
                          "streamSettings": {
                              "network": params.get("type", ["tcp"])[0],
                              "security": "tls",
                              "tlsSettings": {"serverName": params.get("sni", [host])[0]}
                          }
                      }
                  else:
                      return None

                  return {
                      "log": {"loglevel": "none"},
                      "inbounds": [inbound],
                      "outbounds": [outbound]
                  }
              except Exception:
                  return None

          def wait_for_port(port, timeout=3.5):
              t0 = time.time()
              while time.time() - t0 < timeout:
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=0.15):
                          return True
                  except Exception:
                      time.sleep(0.04)
              return False

          verified_nodes = []
          lock = threading.Lock()
          tested_count = 0

          print("\n" + "=" * 80)
          print("[2/3] СТАРТ 5-СТУПЕНЧАТОЙ ВАЛИДАЦИИ (IP LEAK ➔ GEOIP ➔ MTPROTO DC ➔ T.ME ➔ AI STUDIO)...")
          print("=" * 80, flush=True)

          def test_worker(item):
              global tested_count
              idx, link, worker_id = item

              port = 31000 + worker_id
              cfg = build_xray_config(link, port)
              if not cfg:
                  return

              cfg_file = f"cfg_{worker_id}.json"
              with open(cfg_file, "w") as f:
                  json.dump(cfg, f)

              proc = None
              is_valid = False
              info_str = ""

              try:
                  proc = subprocess.Popen(["./xray", "run", "-c", cfg_file], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if not wait_for_port(port, timeout=3.0):
                      return

                  proxies = {
                      "http": f"socks5h://127.0.0.1:{port}",
                      "https": f"socks5h://127.0.0.1:{port}"
                  }
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                      "Accept-Language": "en-US,en;q=0.9"
                  }

                  # 1. ТЕСТ IP LEAK & FALLBACK (Отсекаем фейковые Reality-заглушки)
                  exit_ip = ""
                  try:
                      ip_res = requests.get("http://api.ipify.org", proxies=proxies, timeout=3.5)
                      if ip_res.status_code == 200:
                          exit_ip = ip_res.text.strip()
                  except Exception:
                      return

                  if not exit_ip or exit_ip == RUNNER_IP:
                      return # Фейковый туннель или прямой сброс

                  # 2. ТЕСТ GEOIP & ПРОВАЙДЕРА
                  try:
                      geo_data = requests.get(f"http://ip-api.com/json/{exit_ip}?fields=status,countryCode,isp,org,as", proxies=proxies, timeout=3.5).json()
                      if geo_data.get("status") != "success":
                          return
                      
                      country = geo_data.get("countryCode", "").upper()
                      org = (geo_data.get("org", "") + " " + geo_data.get("isp", "") + " " + geo_data.get("as", "")).lower()

                      if country in BLOCKED_COUNTRIES or any(bad in org for bad in BLOCKED_ORGS):
                          return

                      clean_provider = geo_data.get("org") or geo_data.get("isp") or country
                  except Exception:
                      return

                  # 3. АППАРАТНЫЙ MTPROTO ТЕСТ К ДАТА-ЦЕНТРАМ TELEGRAM (DC2 Европа)
                  tg_socket_ok = False
                  for dc_ip in ["149.154.167.50", "91.108.56.130"]:
                      s = socks.socksocket()
                      s.set_proxy(socks.SOCKS5, "127.0.0.1", port)
                      s.settimeout(3.5)
                      try:
                          s.connect((dc_ip, 443))
                          s.send(b"\xef") # MTProto init handshake
                          tg_socket_ok = True
                          s.close()
                          break
                      except Exception:
                          pass
                      finally:
                          try:
                              s.close()
                          except Exception:
                              pass

                  if not tg_socket_ok:
                      return

                  # 4. ТЕСТ WEB TELEGRAM
                  tme_res = requests.get("https://t.me", proxies=proxies, timeout=3.5)
                  if tme_res.status_code != 200:
                      return

                  # 5. СТРОГИЙ ТЕСТ GOOGLE AI STUDIO
                  t0 = time.time()
                  ai_res = requests.get(AI_STUDIO_URL, proxies=proxies, headers=headers, timeout=5.0, allow_redirects=True)
                  latency = int((time.time() - t0) * 1000)

                  final_url = ai_res.url.lower()
                  body = ai_res.text.lower()

                  if ai_res.status_code in [200, 302]:
                      if "available_regions" not in final_url and "available-regions" not in final_url and "not available in your country" not in body:
                          is_valid = True
                          p = urlparse(link.split("#")[0])
                          remark = link.split("#")[-1] if "#" in link else f"{p.hostname}:{p.port}"
                          info_str = f"Страна: {country} ({clean_provider}) | IP: {exit_ip} | AI Studio: {latency}ms | Узел: {remark}"
              except Exception:
                  pass
              finally:
                  if proc:
                      try:
                          proc.kill()
                          proc.wait(timeout=0.2)
                      except Exception:
                          pass
                  if os.path.exists(cfg_file):
                      try:
                          os.remove(cfg_file)
                      except Exception:
                          pass

              with lock:
                  tested_count += 1
                  if is_valid:
                      verified_nodes.append(link)
                      print(f"[🔥] [{len(verified_nodes):02d} ВЕРИФИЦИРОВАН] {info_str}", flush=True)

          # Берем срез кандидатов для глубокой проверки
          test_pool = [(i, c, i % CONCURRENCY) for i, c in enumerate(candidates[:300])]

          with concurrent.futures.ThreadPoolExecutor(max_workers=CONCURRENCY) as executor:
              list(executor.map(test_worker, test_pool))

          now_str = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

          print("\n" + "=" * 80)
          print(f"[3/3] ИТОГИ: Проверено кандидатов: {tested_count}")
          print(f"[*] 100% ВЕРИФИЦИРОВАНО ДЛЯ TELEGRAM И AI STUDIO: {len(verified_nodes)}")
          print(f"[*] Время обновления: {now_str}")
          print("=" * 80, flush=True)

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              f.write(f"# Last Updated: {now_str} | Verified Working: {len(verified_nodes)}\n")
              for c in verified_nodes:
                  f.write(c + "\n")

          if verified_nodes:
              b64_sub = base64.b64encode(("\n".join(verified_nodes) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_sub)
              print("[+] sub.txt и clean_configs.txt успешно сгенерированы.")
          else:
              open("sub.txt", "w").close()
              print("[!] В этом цикле узлов с полной поддержкой не найдено.")
          EOF
          python3 -u strict_validator.py

      - name: Commit and Push to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase || true
          git add sub.txt clean_configs.txt
          git commit -m "Update strictly verified sub [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || echo "No changes to commit"
          git push

      - name: Publish Release (Zero-Cache & Works in Russia)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[*] Обновление релиза..."
          git tag -f latest
          git push origin latest -f || true
          gh release delete latest -y || true
          gh release create latest sub.txt clean_configs.txt \
            --title "Latest Strictly Verified Telegram & AI Studio Nodes" \
            --notes "Автоматическое обновление: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "[+] Релиз обновлен."
