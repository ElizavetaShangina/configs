name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://www.google.com/generate_204"
  # Свежие, регулярно валидируемые репозитории с VLESS Reality / Trojan / SS
  URL_1: "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/v2ray-base64.txt"
  URL_2: "https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/All_Configs_Sub.txt"
  URL_3: "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/all_configs.txt"
  URL_4: "https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/main/proxy_collect_only_new_for_mirror.txt"
  URL_5: "https://raw.githubusercontent.com/MahanKenway/Freedom-V2Ray/main/all.txt"
  URL_6: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Install Xray-Knife
        run: |
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Collect Fresh Candidates
        run: |
          cat << 'EOF' > fetch.py
          import base64
          import os
          import re
          import requests

          SOURCES = [
              os.environ.get("URL_1"),
              os.environ.get("URL_2"),
              os.environ.get("URL_3"),
              os.environ.get("URL_4"),
              os.environ.get("URL_5"),
              os.environ.get("URL_6")
          ]

          PROTO_REGEX = re.compile(r'^(vless|vmess|trojan|ss)://[^\s\'"<>]+', re.IGNORECASE)

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if any(PROTO_REGEX.match(line.strip()) for line in decoded.splitlines()):
                      return decoded
              except Exception:
                  pass
              return text

          all_configs = []
          for url in SOURCES:
              if not url:
                  continue
              try:
                  print(f"[*] Загрузка источника: {url}", flush=True)
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      content = decode_if_base64(resp.text)
                      count = 0
                      for line in content.splitlines():
                          line = line.strip()
                          if PROTO_REGEX.match(line):
                              all_configs.append(line)
                              count += 1
                      print(f"[+] Успешно извлечено: {count} шт.", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка загрузки {url}: {e}", flush=True)

          # Дедупликация с сохранением порядка (свежие базы в начале)
          unique = []
          seen = set()
          for c in all_configs:
              if c not in seen:
                  seen.add(c)
                  unique.append(c)

          # Берем до 1500 самых свежих серверов для быстрого теста
          selected = unique[:1500]
          print(f"\n[*] Отобрано свежих кандидатов для теста: {len(selected)} (из {len(unique)})", flush=True)

          with open("candidates.txt", "w", encoding="utf-8") as f:
              for c in selected:
                  f.write(c + "\n")
          EOF
          python3 fetch.py

      - name: High-Speed Native Google Validation
        run: |
          if [ -s candidates.txt ]; then
            echo "================================================================================"
            echo "[*] Тестирование серверов против Google через xray-knife (цель: 20 рабочих)..."
            echo "================================================================================"
            
            ./xray-knife http -f candidates.txt \
              -t 35 \
              --timeout 3500 \
              --test-urls "${{ env.TARGET_SITE }}" \
              --max-passed 20 \
              -o xray_out.txt || true
          fi

      - name: Format Clean Subscription for V2Ray
        run: |
          cat << 'EOF' > make_sub.py
          import base64
          import os
          import re

          ALLOWED_SCHEMES = ("vless://", "vmess://", "trojan://", "ss://")
          URI_REGEX = re.compile(r'((?:vless|vmess|trojan|ss)://[^\s\'"<>]+)', re.IGNORECASE)

          cleaned = []
          if os.path.exists("xray_out.txt"):
              with open("xray_out.txt", "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      matches = URI_REGEX.findall(line)
                      for m in matches:
                          m = m.strip()
                          if m.startswith(ALLOWED_SCHEMES) and m not in cleaned:
                              cleaned.append(m)

          final_configs = cleaned[:20]

          print(f"\n================================================================================")
          print(f"[ИТОГ] Сформирован пул из {len(final_configs)} рабочих конфигураций Google!")
          print(f"================================================================================")

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in final_configs:
                  f.write(c + "\n")

          if final_configs:
              b64_sub = base64.b64encode(("\n".join(final_configs) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_sub)
              print("[+] sub.txt (Base64) и clean_configs.txt обновлены.")
          else:
              open("sub.txt", "w").close()
              print("[!] Рабочих конфигураций не обнаружено.")
          EOF
          python3 make_sub.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Update working Google proxies [$(date +'%Y-%m-%d %H:%M')]" || echo "No changes"
            git push
          fi
