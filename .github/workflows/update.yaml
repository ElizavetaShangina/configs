name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Install Xray-Knife
        run: |
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Collect ONLY VLESS Reality Configs
        run: |
          cat << 'EOF' > get_reality.py
          import base64
          import os
          import re
          import requests
          from urllib.parse import urlparse, parse_qs, unquote

          # Источники с чистым VLESS Reality
          SOURCES = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt",
              "https://raw.githubusercontent.com/vfarid/v2ray-share/master/splitted/reality.txt",
              "https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/splitted/reality.txt",
              "https://raw.githubusercontent.com/Leon406/SubFinder/main/sub/share/vless"
          ]

          # Заблокированные/мусорные SNI, которые глушит ТСПУ в РФ
          BLOCKED_SNIS = {
              "yahoo.com", "speedtest.net", "cloudflare.com", "workers.dev",
              "frontdoor.microsoft.com", "cdn.cloudflare.net"
          }

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if "vless://" in decoded or "vmess://" in decoded:
                      return decoded
              except Exception:
                  pass
              return text

          def is_good_reality(link):
              if not link.startswith("vless://"):
                  return False
              link_lower = link.lower()
              # Обязательно наличие Reality
              if "security=reality" not in link_lower:
                  return False
              
              # Парсим параметры для проверки SNI и ключа
              try:
                  parsed = urlparse(link)
                  params = parse_qs(parsed.query)
                  sni = params.get("sni", [""])[0].lower()
                  pbk = params.get("pbk", [""])[0]
                  
                  # Без публичного ключа Reality не работает
                  if not pbk:
                      return False
                  # Исключаем заведомо заблокированные в РФ маскировки
                  if sni in BLOCKED_SNIS:
                      return False
              except Exception:
                  return False
              
              return True

          all_reality = []
          for url in SOURCES:
              try:
                  print(f"[*] Загрузка: {url}", flush=True)
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      content = decode_if_base64(resp.text)
                      count = 0
                      for line in content.splitlines():
                          line = line.strip()
                          if is_good_reality(line):
                              all_reality.append(line)
                              count += 1
                      print(f"[+] Найдено валидных VLESS Reality: {count} шт.", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка: {e}", flush=True)

          # Дедупликация
          unique = []
          seen = set()
          for c in all_reality:
              # Нормализуем строку без комментария #хэштег для точного удаления дублей
              base_part = c.split("#")[0]
              if base_part not in seen:
                  seen.add(base_part)
                  unique.append(c)

          print(f"\n[*] Итого уникальных Reality-конфигов: {len(unique)}", flush=True)
          with open("reality_candidates.txt", "w", encoding="utf-8") as f:
              for c in unique[:1200]:
                  f.write(c + "\n")
          EOF
          python3 get_reality.py

      - name: Test Against Google Connectivity
        run: |
          if [ -s reality_candidates.txt ]; then
            echo "================================================================================"
            echo "[*] Тестирование VLESS Reality серверов через xray-knife..."
            echo "================================================================================"
            
            ./xray-knife http -f reality_candidates.txt \
              -t 35 \
              --timeout 3000 \
              --test-urls "https://www.google.com/generate_204" \
              --max-passed 20 \
              -o live_reality.txt || true
          fi

      - name: Build Clean Subscriptions
        run: |
          cat << 'EOF' > format_out.py
          import base64
          import os
          import re

          cleaned = []
          if os.path.exists("live_reality.txt"):
              with open("live_reality.txt", "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      matches = re.findall(r'(vless://[^\s\'"<>]+)', line, re.IGNORECASE)
                      for m in matches:
                          m = m.strip()
                          if "security=reality" in m.lower() and m not in cleaned:
                              cleaned.append(m)

          # Берем 20 лучших
          final_configs = cleaned[:20]

          print(f"\n[+] Успешно отобрано {len(final_configs)} рабочих VLESS Reality конфигураций.")

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in final_configs:
                  f.write(c + "\n")

          if final_configs:
              b64_data = base64.b64encode(("\n".join(final_configs) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_data)
          else:
              open("sub.txt", "w").close()
          EOF
          python3 format_out.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Update VLESS Reality configs: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
            git push
          fi
