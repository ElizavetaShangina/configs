Используйте код с осторожностью.
Почему эта схема стопроцентно отберет рабочие конфиги:
Использование socks5h://: Буква h в протоколе прокси критически важна. Она заставляет скрипт отправлять DNS-запросы внутрь VPN-туннеля. Провайдер больше не сможет обмануть проверку, подменив IP-адрес GitHub на этапе DNS.
Анализ HTML-кода ("github" in response.text): Скрипт скачивает саму страницу. Если провайдер вместо GitHub подсунет заглушку «Доступ заблокирован», тест провалится.
Естественный барьер для DPI: ТСПУ блокирует трафик именно во время TLS Handshake (обмена сертификатами). Так как Python-скрипт ждет полной установки защищенного соединения, все заблокированные в РФ протоколы отвалятся по таймауту (timeout=3.5) и будут гарантированно отсеяны.
Проверьте этот вариант. В итоговый файл попадут только те конфигурации, которые прямо сейчас физически способны прогрузить сайт. Если воркфлоу будет работать слишком долго — дайте знать, я добавлю многопоточность для портов!





