Ситуация, когда находится много однотипных конфигураций, но на практике они не работают — это классический ложный результат (False Positive).
Почему это происходит в России?
Утилита xray-knife http отправляет поверхностный HTTP-запрос. Заблокированные РКН серверы выдают ложный «успех» по двум причинам:
Блокировка на уровне TLS Handshake (ТСПУ). Обычный пинг или TCP-запрос до сервера проходит нормально (поэтому xray-knife считает их «живыми»), но как только вы пытаетесь открыть реальный сайт, ТСПУ провайдера видит запрещенный протокол (чистый WireGuard, VLESS без маскировки и т.д.) и намертво зажимает трафик. 

Go Packages
Мусорные «зеркальные» конфиги. Публичные репозитории забиты тысячами копий одного и того же нерабочего сервера, который массово генерирует бот-сеть.
Кардинальное решение: Настоящий HTTP-тест через прокси на Python
Мы полностью уберем сомнительный встроенный тест xray-knife http для финального отбора.
Новая логика:
Мы используем xray-knife proxy — утилита развернет локальный SOCKS5-сервер.
Скрипт на Python будет поочередно подключаться через этот SOCKS5-порт и делать настоящий, тяжелый HTTPS-запрос к GitHub средствами стандартной библиотеки requests.
Мы будем проверять не просто статус 200, а наличие слова GitHub в скачанном HTML-коде страницы, чтобы исключить заглушки провайдеров. 

