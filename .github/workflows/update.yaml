name: Auto Update Sub

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests

      - name: Install Xray-Knife (Native Go Engine)
        run: |
          echo "[*] Загрузка Xray-knife..."
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife
          ./xray-knife version || true

      - name: Fetch and Normalize Fresh Nodes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat << 'EOF' > prepare.py
          import base64
          import random
          import re
          import requests
          from urllib.parse import urlparse, parse_qs

          SOURCES = [
              "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt",
              "https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/main/githubmirror/clean/vless.txt",
              "https://raw.githubusercontent.com/MustafaBaqer/VestraNet-Nodes/main/protocols/vless.txt",
              "https://raw.githubusercontent.com/slxkware/Vless-list/raw/refs/heads/main/vless.txt",
              "https://raw.githubusercontent.com/Epodonios/v2ray-configs/raw/main/Splitted-By-Protocol/vless.txt",
              "https://raw.githubusercontent.com/barry-far/V2ray-Configs/raw/main/Splitted-By-Protocol/vless.txt"
          ]

          BAD_SNIS = {"google.com", "speedtest.net", "cloudflare.com", "workers.dev"}

          def decode_if_base64(text):
              try:
                  decoded = base64.b64decode(text.strip()).decode('utf-8', errors='ignore')
                  if "vless://" in decoded:
                      return decoded
              except Exception:
                  pass
              return text

          def normalize_vless(link):
              try:
                  clean_link = link.split("#")[0].strip()
                  remark = link.split("#")[1].strip() if "#" in link else ""
                  
                  if not clean_link.startswith("vless://"):
                      return None
                  
                  p = urlparse(clean_link)
                  host = p.hostname.lower() if p.hostname else ""
                  if not host or host.endswith(".ir") or host.endswith(".cn"):
                      return None
                      
                  params = parse_qs(p.query)
                  
                  # Проверка наличия Reality ключа
                  if "security=reality" in clean_link.lower():
                      if not params.get("pbk"):
                          return None
                      sni = params.get("sni", [""])[0].lower()
                      if any(bad in sni for bad in BAD_SNIS):
                          return None
                      
                      # ИСПРАВЛЕНИЕ: Автоматически добавляем flow=xtls-rprx-vision если его нет
                      if "flow=" not in clean_link and "type=tcp" in clean_link:
                          clean_link += "&flow=xtls-rprx-vision"

                  return f"{clean_link}#{remark}" if remark else clean_link
              except Exception:
                  return None

          collected = set()
          print("=" * 70, flush=True)
          print("[*] СБОР И АВТО-НОРМАЛИЗАЦИЯ VLESS РЕАЛИТИ УЗЛОВ", flush=True)
          print("=" * 70, flush=True)

          for url in SOURCES:
              try:
                  resp = requests.get(url, timeout=12)
                  if resp.status_code == 200:
                      text = decode_if_base64(resp.text)
                      matches = re.findall(r'(vless://[^\s\'"<>]+)', text, re.IGNORECASE)
                      count = 0
                      for m in matches:
                          norm = normalize_vless(m)
                          if norm:
                              collected.add(norm)
                              count += 1
                      print(f"[+] {url.split('/')[-1]}: получено {count} валидных", flush=True)
              except Exception as e:
                  print(f"[!] Ошибка {url.split('/')[-1]}: {e}", flush=True)

          unique_list = list(collected)
          print(f"\n[*] Всего уникальных нормализованных узлов: {len(unique_list)}", flush=True)

          random.shuffle(unique_list)

          with open("candidates.txt", "w", encoding="utf-8") as f:
              for c in unique_list[:500]:
                  f.write(c + "\n")
          EOF
          python3 prepare.py

      - name: High-Speed Native Payload Test (Real Tunnel Check)
        run: |
          if [ -s candidates.txt ]; then
            echo "================================================================================"
            echo "[*] Запуск нативного Go-тестера через Cloudflare Payload Check..."
            echo "================================================================================"
            
            # Тестируем реальную доставку данных через Cloudflare Trace
            ./xray-knife http -f candidates.txt \
              -t 30 \
              --timeout 3500 \
              --test-urls "https://cloudflare.com/cdn-cgi/trace" \
              --max-passed 20 \
              -o passed_raw.txt || true
          fi

      - name: Format Clean Subscription
        run: |
          cat << 'EOF' > make_sub.py
          import base64
          import os
          import re

          URI_REGEX = re.compile(r'(vless://[^\s\'"<>]+)', re.IGNORECASE)

          cleaned = []
          if os.path.exists("passed_raw.txt"):
              with open("passed_raw.txt", "r", encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      matches = URI_REGEX.findall(line)
                      for m in matches:
                          m = m.strip()
                          if m not in cleaned:
                              cleaned.append(m)

          final_configs = cleaned[:20]

          print("\n" + "=" * 70)
          print(f"[ИТОГ] Отобрано {len(final_configs)} гарантированно РАБОТАЮЩИХ конфигураций!")
          print("=" * 70)

          with open("clean_configs.txt", "w", encoding="utf-8", newline="\n") as f:
              for c in final_configs:
                  f.write(c + "\n")

          if final_configs:
              b64_sub = base64.b64encode(("\n".join(final_configs) + "\n").encode('utf-8')).decode('utf-8')
              with open("sub.txt", "w", encoding="utf-8") as f:
                  f.write(b64_sub)
              print("[+] sub.txt и clean_configs.txt успешно обновлены.")
          else:
              open("sub.txt", "w").close()
              print("[!] К сожалению, рабочие узлы не обнаружены.")
          EOF
          python3 make_sub.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -s clean_configs.txt ]; then
            git add sub.txt clean_configs.txt
            git commit -m "Update confirmed working configs: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
            git push
          fi
