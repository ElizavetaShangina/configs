name: Auto Update Sub (Ultra Strict)

on:
  schedule:
    - cron: '0 */4 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

env:
  TARGET_SITE: "https://aistudio.google.com/prompts/new_chat" 
  # Максимальная задержка в мс (800 - очень строго, 1200 - средне)
  MAX_DELAY: "1000"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Public Configs
        run: |
          touch public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt" >> public_raw.txt
          wget -qO- "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" >> public_raw.txt
          
          
          grep -iE 'vless://|vmess://|trojan://|ss://|hysteria2://' public_raw.txt | sort | uniq > configs_to_test.txt
          echo "Всего в базе для теста: $(wc -l < configs_to_test.txt)"

      - name: Setup Xray-Knife
        run: |
          URL=$(curl -s https://api.github.com/repos/lilendian0x00/xray-knife/releases/latest | jq -r '.assets[] | select(.name == "Xray-knife-linux-64.zip") | .browser_download_url')
          wget -qO xray-knife.zip "$URL"
          unzip -o xray-knife.zip -d temp_xray
          mv temp_xray/xray-knife ./xray-knife
          chmod +x xray-knife

      - name: Run Ultra Strict Test
        run: |
          echo "Запускаем проверку на доступность сайта: ${{ env.TARGET_SITE }}"
          
          # http : команда теста
          # --url : именно твой целевой сайт
          # --mdelay : жесткий лимит задержки
          # --thread 50 : скорость теста
          # --out : файл вывода
          ./xray-knife http --file configs_to_test.txt \
                            --url "${{ env.TARGET_SITE }}" \
                            --mdelay ${{ env.MAX_DELAY }} \
                            --thread 50 \
                            --out valid.txt
          
          if [ ! -s valid.txt ]; then
            echo "Ни один сервер не смог открыть ${{ env.TARGET_SITE }} с задержкой < ${{ env.MAX_DELAY }}ms"
            # Попытка №2: чуть менее строго, если все упали
            ./xray-knife http --file configs_to_test.txt --url "${{ env.TARGET_SITE }}" --mdelay 2000 --thread 50 --out valid.txt
          fi
          
          if [ -s valid.txt ]; then
            echo "Рабочих серверов: $(wc -l < valid.txt)"
            # Берем только топ-10 самых надежных
            head -n 10 valid.txt > best.txt
            cat best.txt | base64 -w 0 > sub.txt
          else
            echo "Даже при мягких настройках ничего не найдено."
            # Создаем пустой файл sub.txt, чтобы гит не падал
            echo "" | base64 > sub.txt
          fi

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f sub.txt ]; then
            git add sub.txt
            git commit -m "Ultra Strict Update: $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
            git push
          fi
